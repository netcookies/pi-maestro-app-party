    function App() {

      const [searchQuery, setSearchQuery] = useState("");
      // 配对弹层状态
      const [pairModal, setPairModal] = useState(null); // 'scan' | 'code' | 'candidates' | null

      // 滑动切换与边缘返回手势
      const [swipeDx, setSwipeDx] = useState(0);
      const touchStartX = useRef(0);
      const touchStartY = useRef(0);
      const isTouching = useRef(false);

      const t = i18n[lang];

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
        isTouching.current = true;
      };

      const handleTouchMove = (e) => {
        if (!isTouching.current) return;
        const dx = e.touches[0].clientX - touchStartX.current;
        const dy = Math.abs(e.touches[0].clientY - touchStartY.current);
        if (dy < 40) {
          setSwipeDx(dx);
        }
      };

      const handleTouchEnd = () => {
        if (!isTouching.current) return;
        isTouching.current = false;
        const tabs = ["workbench", "sessions", "monitor", "settings"];
        const idx = tabs.indexOf(tab);

        if (inDetail) {
          // 边缘右滑返回（从屏幕左侧向右滑）
          if (swipeDx > 70) {
            setInDetail(false);
          }
          setSwipeDx(0);
          return;
        }

        // 一级页面左右轻扫切换 Dock 栏
        if (swipeDx < -60 && idx < tabs.length - 1) {
          setTab(tabs[idx + 1]);
        } else if (swipeDx > 60 && idx > 0) {
          setTab(tabs[idx - 1]);
        }
        setSwipeDx(0);
      };

      // 过滤后的会话
      const filteredSessions = mockSessions.filter((s) => {
        if (filter === "active" && s.status === "idle") return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          return s.title.toLowerCase().includes(q) || s.cwd.toLowerCase().includes(q) || s.model.toLowerCase().includes(q);
        }
        return true;
      });

                            <div class="flex items-center gap-2 min-w-0">
                              <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399] shrink-0"></span>
                              <span class="font-bold text-sm text-zinc-100 truncate">{s.title}</span>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded-full bg-purple-950/80 text-purple-300 border border-purple-800/80 font-mono shrink-0">
                              {s.model}
                            </span>
                          </div>

                          {/* 2. 工作目录行 */}
                          <div class="flex items-center gap-1.5 text-[11px] text-zinc-400 font-mono mb-3">
                            <Icons.Folder className="text-zinc-500 shrink-0" />
                            <span class="truncate">{s.cwd}</span>
                          </div>

                          {/* 3. 2×2 Bento 便当盒仪表盘核心网格 */}
                          <div class="grid grid-cols-2 gap-2 bg-cardInner p-3 rounded-2xl border border-zinc-800/80 font-mono text-[11px] mb-2.5">
                            <div>
                              <div class="text-[10px] text-zinc-500 mb-0.5">{t.contextLabel}</div>
                              <div class="text-zinc-200 font-semibold">{s.contextTokens}k / {s.contextMax}k ({s.contextPercent}%)</div>
                            </div>
                            <div>
                              <div class="text-[10px] text-zinc-500 mb-0.5">{t.tokensLabel}</div>
                              <div class="text-zinc-200 font-semibold">{s.totalTokens} <span class="text-zinc-500">({s.cost})</span></div>
                            </div>
                            <div>
                              <div class="text-[10px] text-zinc-500 mb-0.5">{t.cacheLabel}</div>
                              <div class="text-emerald-400 font-semibold">{s.cacheRate}%</div>
                            </div>
                            <div>
                              <div class="text-[10px] text-zinc-500 mb-0.5">对话与时间</div>
                              <div class="text-zinc-300 font-medium">{s.messageCount} {t.msgCount} · {s.updatedAt}</div>
                            </div>
                          </div>

                          {/* 4. 上下文使用率彩色进度条 */}
                          <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                            <div class="h-full bg-purple-500 rounded-full" style={{ width: `${s.contextPercent}%` }}></div>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* 分组头 2：其他工作空间 */}
                    {filteredSessions.some(s => s.group === "group2") && (
                      <div>
                        <div class="text-[11px] font-bold text-zinc-400 tracking-wide uppercase px-1 mb-2 font-mono flex items-center justify-between">
                          <span>{t.groupTitle2}</span>
                          <span class="text-[10px] text-zinc-500">2 会话</span>
                        </div>

                        {filteredSessions.filter(s => s.group === "group2").map(s => (
                          <div
                            key={s.id}
                            onClick={() => setInDetail(true)}
                            class="p-4 rounded-3xl bg-cardBg border border-cardBorder hover:border-purple-500/50 active:scale-[0.99] transition-all cursor-pointer shadow-md mb-3"
                          >
                            <div class="flex items-center justify-between mb-2">
                              <div class="flex items-center gap-2 min-w-0">
                                <span class={`w-2.5 h-2.5 rounded-full shrink-0 ${
                                  s.status === "active" ? "bg-blue-400" : "bg-zinc-600"
                                }`}></span>
                                <span class="font-bold text-sm text-zinc-100 truncate">{s.title}</span>
                              </div>
                              <span class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-300 border border-zinc-700 font-mono shrink-0">
                                {s.model}
                              </span>
                            </div>

                            <div class="flex items-center gap-1.5 text-[11px] text-zinc-400 font-mono mb-3">
                              <Icons.Folder className="text-zinc-500 shrink-0" />
                              <span class="truncate">{s.cwd}</span>
                            </div>

                            <div class="grid grid-cols-2 gap-2 bg-cardInner p-3 rounded-2xl border border-zinc-800/80 font-mono text-[11px] mb-2.5">
                              <div>
                                <div class="text-[10px] text-zinc-500 mb-0.5">{t.contextLabel}</div>
                                <div class="text-zinc-200 font-semibold">{s.contextTokens}k / {s.contextMax}k ({s.contextPercent}%)</div>
                              </div>
                              <div>
                                <div class="text-[10px] text-zinc-500 mb-0.5">{t.tokensLabel}</div>
                                <div class="text-zinc-200 font-semibold">{s.totalTokens} <span class="text-zinc-500">({s.cost})</span></div>
                              </div>
                              <div>
                                <div class="text-[10px] text-zinc-500 mb-0.5">{t.cacheLabel}</div>
                                <div class="text-emerald-400 font-semibold">{s.cacheRate}%</div>
                              </div>
                              <div>
                                <div class="text-[10px] text-zinc-500 mb-0.5">对话与时间</div>
                                <div class="text-zinc-300 font-medium">{s.messageCount} {t.msgCount} · {s.updatedAt}</div>
                              </div>
                            </div>

                            <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                              <div class="h-full bg-purple-500 rounded-full" style={{ width: `${s.contextPercent}%` }}></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* 分页加载完毕标尺 */}
                    <div class="text-center py-2 text-[11px] text-zinc-600 font-mono">
                      {t.loadMore}
                    </div>
                  </div>
                )}

                {/* 设置 Tab：通信中枢与全局参数配置 */}
                {tab === "settings" && (
                  <div class="flex-1 overflow-y-auto px-4 pt-3 pb-28 space-y-4 no-scrollbar">
                    
                    {/* 1. 通信与配对中枢专卡（整合原先在 host-sessions 顶部的全部配对逻辑） */}
                    <div class="p-4 rounded-3xl bg-cardBg border border-purple-500/40 shadow-lg">
                      <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                          <Icons.Radio className="text-purple-400" />
                          <h3 class="font-bold text-sm text-white">{t.hubTitle}</h3>
                        </div>
                        <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-800">
                          CONNECTED
                        </span>
                      </div>
                      <p class="text-xs text-zinc-400 mb-3 leading-relaxed">{t.hubDesc}</p>

                      <div class="bg-cardInner p-3 rounded-2xl border border-zinc-800 font-mono text-[11px] space-y-2 mb-3">
                        <div class="flex justify-between text-zinc-400">
                          <span>{t.hubNode}:</span>
                          <span class="text-zinc-200">ws://100.98.197.10:4739</span>
                        </div>
                        <div class="flex justify-between text-zinc-400">
                          <span>{t.hubHeartbeat}:</span>
                          <span class="text-emerald-400">20s App-Ping (RFC6455 Guard)</span>
                        </div>
                        <div class="flex justify-between text-zinc-400">
                          <span>{t.hubBackpressure}:</span>
                          <span class="text-zinc-300">Bounded 32MB / Code 1013</span>
                        </div>
                      </div>

                      {/* 操作按钮组：扫码配对、输入配对码、重测 */}
                      <div class="grid grid-cols-3 gap-2">
                        <button
                          onClick={() => setPairModal("candidates")}
                          class="py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 flex items-center justify-center gap-1 transition-all"
                        >
                          <Icons.Refresh size={13} />
                          <span>{t.btnRefresh}</span>
                        </button>
                        <button
                          onClick={() => setPairModal("scan")}
                          class="py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-semibold text-white flex items-center justify-center gap-1 transition-all shadow"
                        >
                          <Icons.QrCode size={13} />
                          <span>{t.btnScan}</span>
                        </button>
                        <button
                          onClick={() => setPairModal("code")}
                          class="py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 flex items-center justify-center gap-1 transition-all"
                        >
                          <Icons.Key size={13} />
                          <span>{t.btnCode}</span>
                        </button>
                      </div>
                    </div>

                    {/* 2. 语言与外观偏好 */}
                    <div class="p-4 rounded-3xl bg-cardBg border border-cardBorder text-xs space-y-3">
                      <div class="flex justify-between items-center text-zinc-300">
                        <span class="font-medium">系统语言 / Language</span>
                        <div class="flex bg-cardInner p-0.5 rounded-xl border border-zinc-800 font-mono text-[11px]">
                          <button
                            onClick={() => setLang("zh")}
                            class={`px-2.5 py-1 rounded-lg transition-all ${lang === "zh" ? "bg-purple-600 text-white font-bold" : "text-zinc-400"}`}
                          >
                            中文
                          </button>
                          <button
                            onClick={() => setLang("en")}
                            class={`px-2.5 py-1 rounded-lg transition-all ${lang === "en" ? "bg-purple-600 text-white font-bold" : "text-zinc-400"}`}
                          >
                            EN
                          </button>
                        </div>
                      </div>
                      
                      <div class="border-t border-zinc-800 pt-3 flex justify-between items-center text-zinc-300">
                        <span class="font-medium">边缘右滑返回手势</span>
                        <span class="text-emerald-400 font-mono text-[11px]">已启用 (Swipe-to-Back)</span>
                      </div>
                    </div>

                  </div>
                )}

                {/* 工作台与监控占位 */}
                {(tab === "workbench" || tab === "monitor") && (
                  <div class="flex-1 flex flex-col items-center justify-center text-center p-6 text-zinc-500 font-mono text-xs">
                    <div class="p-3.5 rounded-3xl bg-cardBg border border-cardBorder mb-2 text-zinc-400">
                      {tab === "workbench" ? <Icons.Workbench size={26} /> : <Icons.Monitor size={26} />}
                    </div>
                    <p class="text-zinc-300 font-bold text-sm mb-1">{tab === "workbench" ? "任务工作台" : "主机集群监控"}</p>
                    <p class="text-zinc-500">支持横向手势左滑/右滑快速切换</p>
                  </div>
                )}

                {/* ========================================================================= */}
                {/* 底部悬浮 Floating Toolbar（位于 Dock 上方，单手极佳盲操） */}
                {/* ========================================================================= */}
                {tab === "sessions" && (
                  <div class="absolute bottom-20 inset-x-0 flex justify-center z-40 px-4 pointer-events-none">
                    <div class="glass-bar border border-purple-500/40 shadow-2xl rounded-2xl px-2.5 py-1.5 flex items-center gap-1.5 pointer-events-auto transition-all">
                      
                      {/* 活跃 / 全部 切换 */}
                      <button
                        onClick={() => setFilter("active")}
                        class={`px-3 py-1 rounded-xl text-xs font-semibold transition-all ${
                          filter === "active" ? "bg-purple-600 text-white shadow" : "text-zinc-400 hover:text-zinc-200"
                        }`}
                      >
                        ⚡ {t.filterActive}
                      </button>

                      <button
                        onClick={() => setFilter("all")}
                        class={`px-3 py-1 rounded-xl text-xs font-semibold transition-all ${
                          filter === "all" ? "bg-zinc-800 text-zinc-100 shadow" : "text-zinc-400 hover:text-zinc-200"
                        }`}
                      >
                        {t.filterAll}
                      </button>

                      <div class="w-[1px] h-4 bg-zinc-700 mx-0.5"></div>

                      {/* 悬浮搜索展开 */}
                      {!searchExpanded ? (
                        <button
                          onClick={() => setSearchExpanded(true)}
                          class="p-1.5 text-zinc-400 hover:text-white rounded-xl transition-all"
                          title="搜索"
                        >
                          <Icons.Search size={14} />
                        </button>
                      ) : (
                        <div class="flex items-center gap-1 bg-black/60 rounded-xl px-2 py-0.5 border border-zinc-700">
                          <input
                            type="text"
                            placeholder={t.searchPlaceholder}
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            class="bg-transparent text-xs text-white focus:outline-none w-28 font-mono"
                            autoFocus
                          />
                          <button onClick={() => { setSearchExpanded(false); setSearchQuery(""); }} class="text-zinc-500 text-xs px-1">✕</button>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* 底部 Dock 栏（优化项 1: 支持横滑切换） */}
                <div class="h-16 glass-dock border-t border-cardBorder flex items-center justify-around px-2 z-40">
                  {[
                    { id: "workbench", label: t.tabWorkbench, Icon: Icons.Workbench },
                    { id: "sessions", label: t.tabSessions, Icon: Icons.Chat },
                    { id: "monitor", label: t.tabMonitor, Icon: Icons.Monitor },
                    { id: "settings", label: t.tabSettings, Icon: Icons.Settings },
                  ].map((item) => {
                    const active = tab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setTab(item.id)}
                        class={`flex flex-col items-center justify-center flex-1 py-1 transition-all ${
                          active ? "text-purple-400 font-bold scale-105" : "text-zinc-500 hover:text-zinc-300"
                        }`}
                      >
                        <item.Icon size={18} className="mb-0.5" />
                        <span class="text-[10px] tracking-tight">{item.label}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* ========================================================================= */}
              {/* 二级页面：详细会话页（优化项 2: 最小化回会话 + 优化项 3: 边缘右滑返回） */}
              {/* ========================================================================= */}
              <div class={`absolute inset-0 bg-appDark flex flex-col z-50 transition-all duration-300 ${
                inDetail ? "translate-x-0 opacity-100" : "translate-x-full opacity-0 pointer-events-none"
              }`}>
                {/* 详情页 Header */}
                <div class="px-4 py-2.5 border-b border-cardBorder flex items-center justify-between glass-dock">
                  {/* 左上角最小化：返回会话列表，绝不跳工作台 */}
                  <button
                    onClick={() => setInDetail(false)}
                    class="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-cardInner border border-zinc-700/80 text-zinc-300 text-xs font-medium hover:text-white"
                  >
                    <Icons.Minimize size={13} />
                    <span>{t.backBtn}</span>
                  </button>

                  <div class="text-center">
                    <h2 class="text-xs font-bold text-zinc-100 font-mono">pi-maestro-app-party</h2>
                    <span class="text-[10px] text-emerald-400 font-mono">● {t.statusStreaming}</span>
                  </div>

                  <div class="w-12 flex justify-end text-zinc-500">
                    <Icons.Settings size={15} />
                  </div>
                </div>

                {/* 边缘右滑返回引导 */}
                <div class="bg-purple-950/40 border-b border-purple-900/30 px-4 py-1 text-[10px] text-purple-300 flex items-center justify-between font-mono">
                  <span>{t.swipeBackHint}</span>
                  <span>可拖拽体验</span>
                </div>

                {/* 聊天气泡区：展示 Bug 1、Bug 2、Bug 3 修复后的真实视觉效果 */}
                <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
                  
                  {/* 用户气泡（单条渲染，无重复） */}
                  <div class="flex justify-end">
                    <div class="max-w-[80%] bg-purple-600 text-white px-3.5 py-2 rounded-2xl rounded-tr-xs text-xs shadow-md font-medium">
                      ios 消息测试
                    </div>
                  </div>

                  {/* 大模型回复气泡 */}
                  <div class="flex justify-start">
                    <div class="max-w-[92%] bg-cardBg border border-cardBorder text-zinc-200 p-4 rounded-3xl rounded-tl-xs text-xs space-y-2.5 shadow-md">
                      
                      <p class="leading-relaxed">
                        {t.testPrompt}
                        {/* Bug 2 修复展示：嵌套加粗等宽代码 */}
                        <span class="inline-block px-1.5 py-0.5 rounded bg-cardInner text-purple-300 font-mono font-bold border border-zinc-700">
                          {t.testTag}
                        </span>
                        ！
                      </p>

                      <p class="font-medium text-zinc-300">{t.testSub}</p>

                      {/* Bug 1 修复展示：有序列表后文字全部保留 */}
                      <div class="space-y-1.5 pl-2 border-l-2 border-purple-500/50 my-2">
                        <div class="flex items-start gap-1.5 text-zinc-200">
                          <span class="text-purple-400 font-mono font-bold">1.</span>
                          <span>{t.test1}</span>
                        </div>
                        <div class="flex items-start gap-1.5 text-zinc-200">
                          <span class="text-purple-400 font-mono font-bold">2.</span>
                          <span>{t.test2}</span>
                        </div>
                      </div>

                      {/* Bug 3 修复展示：带 # 符号与层级强调色的标题 */}
                      <div class="pt-2 border-t border-zinc-800/80">
                        <div class="text-sm font-bold text-white flex items-center gap-1.5">
                          <span class="text-purple-400 font-mono font-semibold">###</span>
                          <span>{t.titleDemo}</span>
                        </div>
                        <p class="text-[11px] text-zinc-400 mt-1 leading-relaxed">
                          完全基于方案 B 便当盒工坊深化，2×2 Bento Grid + Floating Toolbar + 边缘返回已全部在原型中就绪。
                        </p>
                      </div>

                    </div>
                  </div>
                </div>

                {/* 底部输入框 */}
                <div class="p-3 border-t border-cardBorder glass-dock flex items-center gap-2">
                  <input
                    type="text"
                    placeholder={t.inputPlaceholder}
                    class="flex-1 bg-black/60 border border-zinc-700/80 rounded-full px-3.5 py-2 text-xs text-white focus:outline-none focus:border-purple-500"
                  />
                  <button class="w-8 h-8 rounded-full bg-purple-600 hover:bg-purple-500 flex items-center justify-center text-white text-xs shadow-md">
                    <Icons.Send size={13} />
                  </button>
                </div>
              </div>

              {/* ========================================================================= */}
              {/* 配对中枢弹窗（保留生产全部配对能力） */}
              {/* ========================================================================= */}
              {pairModal && (
                <div class="absolute inset-0 bg-black/80 z-50 flex flex-col justify-end p-4 animate-fade-in">
                  <div class="bg-cardBg border border-cardBorder rounded-3xl p-5 space-y-3 shadow-2xl">
                    <div class="flex justify-between items-center pb-2 border-b border-zinc-800">
                      <h4 class="text-sm font-bold text-white">
                        {pairModal === "scan" && "扫描 PC 终端二维码"}
                        {pairModal === "code" && "输入 8 位配对码"}
                        {pairModal === "candidates" && "选择候选 IP 地址"}
                      </h4>
                      <button onClick={() => setPairModal(null)} class="text-zinc-500 hover:text-white">
                        <Icons.Close size={18} />
                      </button>
                    </div>

                    {pairModal === "scan" && (
                      <div class="py-6 flex flex-col items-center justify-center text-center">
                        <div class="w-44 h-44 rounded-2xl border-2 border-dashed border-purple-500/80 flex items-center justify-center mb-3 bg-black/40">
                          <Icons.QrCode size={48} className="text-purple-400 opacity-60" />
                        </div>
                        <p class="text-xs text-zinc-300">对准 Mac 终端执行 /maestro-mobile qr 后的二维码</p>
                        <p class="text-[11px] text-zinc-500 mt-1 font-mono">（扫码完成后相机自动关停，iOS 绿点即灭）</p>
                      </div>
                    )}

                    {pairModal === "code" && (
                      <div class="py-3 space-y-2">
                        <p class="text-xs text-zinc-400">输入 PC 终端提示框中的 8 位数字配对码：</p>
                        <input
                          type="text"
                          placeholder="例如: 84920153"
                          class="w-full bg-cardInner border border-zinc-700 rounded-xl p-3 text-center text-base font-mono tracking-widest text-white focus:outline-none focus:border-purple-500"
                        />
                        <button onClick={() => setPairModal(null)} class="w-full py-2.5 rounded-xl bg-purple-600 text-white font-bold text-xs mt-2">
                          验证并连接
                        </button>
                      </div>
                    )}

                    {pairModal === "candidates" && (
                      <div class="py-2 space-y-2">
                        <p class="text-xs text-zinc-400">检测到多个候选 IP 节点，请选择：</p>
                        <div class="space-y-1.5 font-mono text-xs">
                          {["100.98.197.10:4739 (Tailscale / VPN)", "192.168.1.108:4739 (局域网 Wi-Fi)"].map((ip, i) => (
                            <button
                              key={i}
                              onClick={() => setPairModal(null)}
                              class="w-full p-2.5 rounded-xl bg-cardInner border border-zinc-800 hover:border-purple-500 text-left text-zinc-200 text-xs flex justify-between items-center"
                            >
                              <span>{ip}</span>
                              <span class="text-purple-400 text-[10px]">PING OK</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

            </div>

            {/* iOS 底部 Home Bar */}
            <div class="h-5 flex items-center justify-center z-50">
              <div class="w-32 h-1 bg-zinc-600 rounded-full"></div>
            </div>
          </div>

          {/* 交互说明与功能完整性 checklist */}
          <div class="mt-6 text-xs text-zinc-400 text-center max-w-xl space-y-1 font-mono">
            <p class="text-zinc-200 font-bold">方案 B（便当盒工坊）完整功能检验点：</p>
            <p>1. 底部 Floating Toolbar：切换 <span class="text-purple-400">⚡ 活跃</span> / 全部，点击放大镜流体展开搜索。</p>
            <p>2. 点击会话卡片进入详情，测试左上角“收起会话”（回会话列表，不跳工作台）与左边缘右滑返回。</p>
            <p>3. 点击“设置”Tab，查看迁移后的“通信与配对中枢”，点击扫码/配对码测试弹层交互。</p>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
