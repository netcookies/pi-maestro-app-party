        }
      ]);
      const [chatDraft, setChatDraft] = useState("");

      // 手势
      const [swipeDx, setSwipeDx] = useState(0);
      const touchStartX = useRef(0);
      const touchStartY = useRef(0);
      const isTouching = useRef(false);

      const t = i18n[lang];

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
        isTouching.current = true;
      };

      const handleTouchMove = (e) => {
        if (!isTouching.current) return;
        const dx = e.touches[0].clientX - touchStartX.current;
        const dy = Math.abs(e.touches[0].clientY - touchStartY.current);
        if (dy < 40) setSwipeDx(dx);
      };

      const handleTouchEnd = () => {
        if (!isTouching.current) return;
        isTouching.current = false;
        const tabs = ["workbench", "sessions", "monitor", "settings"];
        const idx = tabs.indexOf(tab);

        if (inDetail) {
          // 边缘右滑返回
          if (swipeDx > 70) setInDetail(false);
          setSwipeDx(0);
          return;
        }

                    <div class={`p-4 rounded-3xl border border-purple-500/40 shadow-lg ${cardClass}`}>
                      <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                          <Icons.Radio className="text-purple-500" />
                          <h3 class="font-bold text-sm">{t.secHub}</h3>
                        </div>
                        <span class={`text-[10px] font-mono px-2 py-0.5 rounded-full border ${
                          isDark ? "bg-emerald-950 text-emerald-400 border-emerald-800" : "bg-emerald-100 text-emerald-800 border-emerald-300 font-bold"
                        }`}>
                          {t.hostConnected}
                        </span>
                      </div>
                      <p class="text-xs opacity-70 mb-3 leading-relaxed">{t.hubDesc}</p>

                      <div class={`p-3 rounded-2xl border font-mono text-[11px] space-y-2 mb-3 ${cardInnerClass}`}>
                        <div class="flex justify-between opacity-75">
                          <span>{t.hubNode}:</span>
                          <span class="font-semibold">ws://100.98.197.10:4739</span>
                        </div>
                        <div class="flex justify-between opacity-75">
                          <span>{t.hubHeartbeat}:</span>
                          <span class="text-emerald-500 font-semibold">{t.hubHeartbeatVal}</span>
                        </div>
                        <div class="flex justify-between opacity-75">
                          <span>{t.hubBackpressure}:</span>
                          <span class="font-semibold">32MB 有界隔离 (1013)</span>
                        </div>
                      </div>

                      {/* 三联配对操作组 */}
                      <div class="grid grid-cols-3 gap-2">
                        <button
                          onClick={() => setPairModal("candidates")}
                          class={`py-2 rounded-xl text-xs font-medium flex items-center justify-center gap-1 transition-all border ${
                            isDark ? "bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border-zinc-700" : "bg-zinc-100 hover:bg-zinc-200 text-zinc-800 border-zinc-300"
                          }`}
                        >
                          <Icons.Refresh size={13} />
                          <span>{t.btnRefresh}</span>
                        </button>
                        <button
                          onClick={() => setPairModal("scan")}
                          class="py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-semibold text-white flex items-center justify-center gap-1 transition-all shadow"
                        >
                          <Icons.QrCode size={13} />
                          <span>{t.btnScan}</span>
                        </button>
                        <button
                          onClick={() => setPairModal("code")}
                          class={`py-2 rounded-xl text-xs font-medium flex items-center justify-center gap-1 transition-all border ${
                            isDark ? "bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border-zinc-700" : "bg-zinc-100 hover:bg-zinc-200 text-zinc-800 border-zinc-300"
                          }`}
                        >
                          <Icons.Key size={13} />
                          <span>{t.btnCode}</span>
                        </button>
                      </div>
                    </div>

                    {/* 模块 4：数据拉取性能参数与行为 */}
                    <div class={`p-4 rounded-3xl border space-y-3.5 ${cardClass}`}>
                      <div class="text-xs font-bold mb-1">{t.secParams}</div>
                      {t.settingsSliders.map((s, idx) => (
                        <div key={idx} class="space-y-1 font-mono text-xs">
                          <div class="flex justify-between opacity-75">
                            <span>{s.label}</span>
                            <span class="text-purple-500 font-bold">{s.value} {s.unit}</span>
                          </div>
                          <div class="w-full h-1.5 bg-zinc-700/30 rounded-full overflow-hidden">
                            <div class="h-full bg-purple-500 rounded-full" style={{ width: `${(idx + 1) * 22}%` }}></div>
                          </div>
                        </div>
                      ))}

                      <div class="border-t pt-3 space-y-3 divide-y divide-zinc-700/20">
                        {t.settingsSwitches.map((item, idx) => (
                          <div key={idx} class="flex items-center justify-between text-xs pt-2">
                            <div>
                              <div class="font-medium">{item.label}</div>
                              <div class="text-[11px] opacity-50">{item.desc}</div>
                            </div>
                            <div class="w-10 h-6 bg-purple-600 rounded-full p-0.5 flex items-center justify-end">
                              <div class="w-5 h-5 rounded-full bg-white shadow"></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* 模块 5：版本与诊断信息 (放置在最下方) */}
                    <div class={`p-4 rounded-3xl border space-y-2.5 ${cardClass}`}>
                      <div class="text-xs font-bold tracking-tight mb-1">{t.secVersion}</div>
                      <div class="space-y-2 text-xs font-mono divide-y divide-zinc-700/20">
                        <div class="flex justify-between pt-1 opacity-80">
                          <span>{t.versionApp}</span>
                          <span class="font-bold">0.2.15 (Build 15)</span>
                        </div>
                        <div class="flex justify-between pt-1.5 opacity-80">
                          <span>{t.versionHost}</span>
                          <span class="text-purple-500 font-bold">0.2.15 (Mac-ARM64)</span>
                        </div>
                        <div class="flex justify-between pt-1.5 opacity-80">
                          <span>{t.versionPi}</span>
                          <span>v0.56.0-native</span>
                        </div>
                        <div class="flex justify-between pt-1.5 opacity-80">
                          <span>{t.versionFlow}</span>
                          <span>3.0.0-odyssey</span>
                        </div>
                        <div class="flex justify-between pt-1.5 opacity-80">
                          <span>{t.versionCli}</span>
                          <span>3.0.0 (Global)</span>
                        </div>
                        <div class="flex justify-between pt-1.5 opacity-80">
                          <span>{t.versionCompat}</span>
                          <span class="text-emerald-500 font-semibold">{t.versionCompatVal}</span>
                        </div>
                      </div>
                    </div>

                  </div>
                )}

                {/* ========================================================================= */}
                {/* 底部悬浮：活跃/全部 胶囊 + 右侧单独搜索 FAB */}
                {/* ========================================================================= */}
                {tab === "sessions" && !searchBarOpen && (
                  <div class="absolute bottom-20 inset-x-0 flex items-center justify-between px-5 z-40 pointer-events-none">
                    {/* 左/中：活跃/全部 悬浮药丸 */}
                    <div class={`shadow-2xl rounded-2xl px-2 py-1.5 flex items-center gap-1.5 pointer-events-auto border transition-all ${
                      isDark ? "glass-bar border-purple-500/40" : "bg-white/95 border-purple-300 shadow-xl"
                    }`}>
                      <button
                        onClick={() => setFilter("active")}
                        class={`px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                          filter === "active" ? "bg-purple-600 text-white shadow" : "opacity-60 hover:opacity-100"
                        }`}
                      >
                        ⚡ {t.filterActive}
                      </button>

                      <button
                        onClick={() => setFilter("all")}
                        class={`px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                          filter === "all" ? (isDark ? "bg-zinc-800 text-zinc-100 shadow" : "bg-zinc-200 text-zinc-900 shadow") : "opacity-60 hover:opacity-100"
                        }`}
                      >
                        {t.filterAll}
                      </button>
                    </div>

                    {/* 右侧：单独的搜索 FAB（单手拇指极易点击） */}
                    <button
                      onClick={() => setSearchBarOpen(true)}
                      class="pointer-events-auto w-11 h-11 rounded-2xl bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center shadow-2xl transition-all active:scale-95"
                      title="搜索会话"
                    >
                      <Icons.Search size={18} />
                    </button>
                  </div>
                )}

                {/* 底部原位弹出的整行全宽搜索栏 (优化项：在底部原位弹出，不跳顶) */}
                {tab === "sessions" && searchBarOpen && (
                  <div class="absolute bottom-20 inset-x-4 z-40 pointer-events-auto animate-fade-in">
                    <div class={`p-2 rounded-2xl border shadow-2xl flex items-center gap-2 ${
                      isDark ? "bg-zinc-900/95 border-purple-500/60" : "bg-white border-purple-400 shadow-xl"
                    }`}>
                      <div class="pl-2 opacity-60">
                        <Icons.Search size={15} />
                      </div>
                      <input
                        type="text"
                        placeholder={t.searchPlaceholder}
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        class={`flex-1 text-xs focus:outline-none bg-transparent ${isDark ? "text-white" : "text-zinc-900"}`}
                        autoFocus
                      />
                      {searchQuery && (
                        <button onClick={() => setSearchQuery("")} class="text-xs opacity-50 px-1">✕</button>
                      )}
                      <button
                        onClick={() => { setSearchBarOpen(false); setSearchQuery(""); }}
                        class="text-xs font-bold text-white bg-purple-600 px-3 py-1.5 rounded-xl shadow"
                      >
                        完成
                      </button>
                    </div>
                  </div>
                )}

                {/* 底部 4 栏 Dock 栏（优化项 1: 支持横滑手势切换） */}
                <div class={`h-16 border-t flex items-center justify-around px-2 z-40 ${dockClass}`}>
                  {[
                    { id: "workbench", label: t.tabWorkbench, Icon: Icons.Workbench },
                    { id: "sessions", label: t.tabSessions, Icon: Icons.Chat },
                    { id: "monitor", label: t.tabMonitor, Icon: Icons.Monitor },
                    { id: "settings", label: t.tabSettings, Icon: Icons.Settings },
                  ].map((item) => {
                    const active = tab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setTab(item.id)}
                        class={`flex flex-col items-center justify-center flex-1 py-1 transition-all ${
                          active ? "text-purple-500 font-bold scale-105" : "opacity-50 hover:opacity-100"
                        }`}
                      >
                        <item.Icon size={18} className="mb-0.5" />
                        <span class="text-[10px] tracking-tight">{item.label}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* ========================================================================= */}
              {/* 二级页面：详细会话页 (优化项 2: 最小化不跳错 + 优化项 3: 边缘右滑返回) */}
              {/* ========================================================================= */}
              <div class={`absolute inset-0 flex flex-col z-50 transition-all duration-300 ${bgClass} ${
                inDetail ? "translate-x-0 opacity-100" : "translate-x-full opacity-0 pointer-events-none"
              }`}>
                {/* 详情页 Header */}
                <div class={`px-4 py-2.5 border-b flex items-center justify-between ${dockClass}`}>
                  {/* 左上角返回：精确回到会话列表 */}
                  <button
                    onClick={() => setInDetail(false)}
                    class={`flex items-center gap-1 px-2.5 py-1 rounded-xl border text-xs font-medium ${
                      isDark ? "bg-zinc-800 border-zinc-700 text-zinc-300 hover:text-white" : "bg-zinc-100 border-zinc-300 text-zinc-700"
                    }`}
                  >
                    <Icons.Minimize size={13} />
                    <span>{t.backBtn}</span>
                  </button>

                  <div class="text-center">
                    <h2 class="text-xs font-bold font-mono">{activeSession.title}</h2>
                    <span class="text-[10px] text-emerald-500 font-mono">● {t.statusStreaming}</span>
                  </div>

                  <div class="w-12 flex justify-end opacity-50">
                    <Icons.Settings size={15} />
                  </div>
                </div>

                {/* 边缘右滑返回引导 */}
                <div class="bg-purple-950/40 border-b border-purple-900/30 px-4 py-1 text-[10px] text-purple-400 flex items-center justify-between font-mono">
                  <span>{t.swipeBackHint}</span>
                  <span>可拖拽体验</span>
                </div>

                {/* 对话消息流 */}
                <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
                  {chatMessages.map((msg) => (
                    <div key={msg.id} class={`flex ${msg.sender === "user" ? "justify-end" : "justify-start"}`}>
                      {msg.sender === "user" ? (
                        <div class="max-w-[80%] bg-purple-600 text-white px-3.5 py-2 rounded-2xl rounded-tr-xs text-xs shadow-md font-medium">
                          {msg.text}
                        </div>
                      ) : (
                        <div class={`max-w-[92%] border p-4 rounded-3xl rounded-tl-xs text-xs space-y-2.5 shadow-md leading-relaxed ${cardClass}`}>
                          <p>
                            收到你的最新 iPhone 消息：
                            <span class={`inline-block px-1.5 py-0.5 rounded font-mono font-bold border ${isDark ? "bg-cardInnerDark text-purple-300 border-zinc-700" : "bg-purple-50 text-purple-700 border-purple-200"}`}>
                              ios 消息测试
                            </span>
                            ！
                          </p>

                          <p class="font-medium opacity-80">请看此时手机端屏幕：</p>

                          {/* Bug 1 修复展示：有序列表后文字全部保留 */}
                          <div class="space-y-1.5 pl-2 border-l-2 border-purple-500/50 my-2">
                            <div class="flex items-start gap-1.5">
                              <span class="text-purple-500 font-mono font-bold">1.</span>
                              <span>是否只渲染了一次（不再出现两条一模一样的蓝色用户气泡）？</span>
                            </div>
                            <div class="flex items-start gap-1.5">
                              <span class="text-purple-500 font-mono font-bold">2.</span>
                              <span>当前这条回复的流式输出是否依然流畅同屏打字？</span>
                            </div>
                          </div>

                          {/* Bug 3 修复展示：带 # 符号与层级强调色的标题 */}
                          <div class={`pt-2 border-t ${borderClass}`}>
                            <div class="text-sm font-bold flex items-center gap-1.5">
                              <span class="text-purple-500 font-mono font-semibold">###</span>
                              <span>根因与修复结论</span>
                            </div>
                            <p class="text-[11px] opacity-70 mt-1">
                              已支持底部原位全宽搜索栏、设置顺序精准重排与三段式外观模式。
                            </p>
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>

                {/* 底部输入框 */}
                <div class={`p-3 border-t flex items-center gap-2 ${dockClass}`}>
                  <input
                    type="text"
                    placeholder="输入消息发送给桌面 TUI..."
                    value={chatDraft}
                    onChange={(e) => setChatDraft(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && handleSendChat()}
                    class={`flex-1 border rounded-full px-3.5 py-2 text-xs focus:outline-none focus:border-purple-500 ${
                      isDark ? "bg-black/60 border-zinc-700 text-white" : "bg-white border-zinc-300 text-zinc-900"
                    }`}
                  />
                  <button
                    onClick={handleSendChat}
                    class="w-8 h-8 rounded-full bg-purple-600 hover:bg-purple-500 flex items-center justify-center text-white text-xs shadow-md"
                  >
                    <Icons.Send size={13} />
                  </button>
                </div>
              </div>

              {/* ========================================================================= */}
              {/* 配对中枢交互弹层 */}
              {/* ========================================================================= */}
              {pairModal && (
                <div class="absolute inset-0 bg-black/80 z-50 flex flex-col justify-end p-4 animate-fade-in">
                  <div class={`border rounded-3xl p-5 space-y-3 shadow-2xl ${cardClass}`}>
                    <div class={`flex justify-between items-center pb-2 border-b ${borderClass}`}>
                      <h4 class="text-sm font-bold">
                        {pairModal === "scan" && "扫描 PC 终端二维码"}
                        {pairModal === "code" && "输入 8 位配对码"}
                        {pairModal === "candidates" && "选择候选 IP 节点"}
                      </h4>
                      <button onClick={() => setPairModal(null)} class="opacity-60 hover:opacity-100">
                        <Icons.Close size={18} />
                      </button>
                    </div>

                    {pairModal === "scan" && (
                      <div class="py-6 flex flex-col items-center justify-center text-center">
                        <div class={`w-44 h-44 rounded-2xl border-2 border-dashed border-purple-500/80 flex items-center justify-center mb-3 ${isDark ? "bg-black/40" : "bg-zinc-50"}`}>
                          <Icons.QrCode size={48} className="text-purple-500 opacity-70" />
                        </div>
                        <p class="text-xs opacity-80">对准 Mac 终端执行 /maestro-mobile qr 后的二维码</p>
                        <p class="text-[11px] opacity-50 mt-1 font-mono">（扫码成功后相机自动关闭，iOS 顶栏绿点即灭）</p>
                      </div>
                    )}

                    {pairModal === "code" && (
                      <div class="py-3 space-y-2">
                        <p class="text-xs opacity-75">输入 PC 终端提示框中的 8 位数字配对码：</p>
                        <input
                          type="text"
                          placeholder="例如: 84920153"
                          class={`w-full border rounded-xl p-3 text-center text-base font-mono tracking-widest focus:outline-none focus:border-purple-500 ${cardInnerClass}`}
                        />
                        <button onClick={() => setPairModal(null)} class="w-full py-2.5 rounded-xl bg-purple-600 text-white font-bold text-xs mt-2">
                          验证并连接
                        </button>
                      </div>
                    )}

                    {pairModal === "candidates" && (
                      <div class="py-2 space-y-2">
                        <p class="text-xs opacity-75">检测到多个候选 IP 节点，请选择：</p>
                        <div class="space-y-1.5 font-mono text-xs">
                          {["100.98.197.10:4739 (Tailscale / VPN)", "192.168.1.108:4739 (局域网 Wi-Fi)"].map((ip, i) => (
                            <button
                              key={i}
                              onClick={() => setPairModal(null)}
                              class={`w-full p-2.5 rounded-xl border text-left text-xs flex justify-between items-center ${cardInnerClass} hover:border-purple-500`}
                            >
                              <span>{ip}</span>
                              <span class="text-purple-500 text-[10px]">PING OK</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

            </div>

            {/* iOS 底部 Home Bar */}
            <div class="h-5 flex items-center justify-center z-50">
              <div class={`w-32 h-1 rounded-full ${isDark ? "bg-zinc-600" : "bg-zinc-400"}`}></div>
            </div>
          </div>

          {/* 交互说明 */}
          <div class="mt-4 text-xs text-zinc-400 text-center max-w-xl space-y-1 font-mono">
            <p class="text-zinc-200 font-bold">本次微调成果核对：</p>
            <p>1. <span class="text-purple-400">底部原位全宽搜索</span>：点击右下角紫色搜索 FAB，整行输入框在<strong>大拇指触手可及的底部原位弹出</strong>，不再跳顶。</p>
            <p>2. <span class="text-purple-400">设置页面严格按序排列</span>：① 外观（含跟随系统/深色/浅色三段）→ ② 语言 → ③ 配对情况 → ④ 参数 → ⑤ 版本与诊断（置底）。</p>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
