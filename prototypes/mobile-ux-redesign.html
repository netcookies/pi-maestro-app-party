    function App() {

      const [tab, setTab] = useState("sessions");
      const [lang, setLang] = useState("zh");
      const [filter, setFilter] = useState("active");
      const [inDetail, setInDetail] = useState(false);
      const [searchActive, setSearchActive] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");

      // 手势支持
      const [dragX, setDragX] = useState(0);
      const touchStartX = useRef(0);
      const touchStartY = useRef(0);
      const isDragging = useRef(false);

      const t = i18n[lang];

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
        isDragging.current = true;
      };

      const handleTouchMove = (e) => {
        if (!isDragging.current) return;
        const dx = e.touches[0].clientX - touchStartX.current;
        const dy = Math.abs(e.touches[0].clientY - touchStartY.current);
        if (dy < 35) {
          setDragX(dx);
        }
      };

      const handleTouchEnd = () => {
        if (!isDragging.current) return;
        isDragging.current = false;
        const tabs = ["workbench", "sessions", "monitor", "settings"];
        const idx = tabs.indexOf(tab);

        if (inDetail) {
          // 二级详情页边缘右滑返回
          if (dragX > 70) {
            setInDetail(false);
          }
          setDragX(0);
          return;
        }

        // 一级导航左右滑动切换 Dock
        if (dragX < -60 && idx < tabs.length - 1) {
          setTab(tabs[idx + 1]);
        } else if (dragX > 60 && idx > 0) {
          setTab(tabs[idx - 1]);
        }
        setDragX(0);
      };

            </button>
          </div>

          <div class="text-xs text-zinc-400 mb-4 text-center max-w-xl px-2">
            {direction === "A" && (
              <span class="text-blue-400">
                【方案 A · 动态流体岛】：界面无冗余 Header，底部采用<strong>双层合一的 Floating Island</strong>，横向紧凑芯片卡片，纯单色极简线条，单手掌控度最高。

                </div>
              </div>
            </div>

                        {tab === "monitor" && t.tabMonitor}
                        {tab === "settings" && t.tabSettings}
                      </span>

                        class="p-3.5 rounded-2xl bg-appCardA border border-zinc-800/80 hover:border-blue-500/50 active:scale-[0.99] transition-all cursor-pointer relative overflow-hidden"
                      >
                        {/* 左侧状态色条指示 */}
                        <div class={`absolute left-0 top-0 bottom-0 w-1 ${
                          s.status === "streaming" ? "bg-emerald-400" : s.status === "active" ? "bg-blue-500" : "bg-zinc-600"
                        }`}></div>

                        <div class="pl-1">
                          <div class="flex items-center justify-between mb-1.5">
                            <span class="text-sm font-semibold text-white truncate max-w-[210px]">{s.name}</span>
                            <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 border border-zinc-700">
                              {s.model}
                            </span>
                          </div>

                          <div class="flex items-center gap-1 text-[11px] text-zinc-400 font-mono truncate mb-2">
                            <Icons.Folder className="text-zinc-500 shrink-0" />
                            <span class="truncate">{s.path}</span>
                          </div>

                          {/* 极简上下文细条 */}
                          <div class="w-full h-1 bg-zinc-800 rounded-full overflow-hidden mb-2.5">
                            <div class="h-full bg-blue-500" style={{ width: `${s.ctxRatio}%` }}></div>
                          </div>

                          {/* 紧凑数据行 */}
                          <div class="flex items-center justify-between text-[10px] font-mono text-zinc-400">
                            <div class="flex items-center gap-2.5">
                              <span>{s.msgs} {t.msgCount}</span>
                              <span>Hit: {s.cache}%</span>
                            </div>
                            <div class="flex items-center gap-2 text-zinc-300 font-semibold">
                              <span>{s.tokens}</span>
                              <span class="text-zinc-500">{s.cost}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}

                    {/* --- 方向 B 的卡片：Bento Grid 仪表盘结构卡 (MIUIX) --- */}
                    {direction === "B" && mockData.map((s) => (
                      <div
                        key={s.id}
                        onClick={() => setInDetail(true)}
                        class="p-4 rounded-3xl bg-appCardB border border-zinc-800 shadow-md hover:border-purple-500/50 active:scale-[0.99] transition-all cursor-pointer"
                      >
                        {/* 顶栏：模型 + 状态 Badge */}
                        <div class="flex items-center justify-between mb-2">
                          <div class="flex items-center gap-1.5">
                            <span class={`w-2 h-2 rounded-full ${
                              s.status === "streaming" ? "bg-emerald-400" : s.status === "active" ? "bg-blue-400" : "bg-zinc-500"
                            }`}></span>
                            <span class="font-bold text-sm text-zinc-100">{s.name}</span>
                          </div>
                          <span class="text-[10px] px-2 py-0.5 rounded-full bg-purple-950/80 text-purple-300 border border-purple-800 font-mono">
                            {s.model}
                          </span>
                        </div>

                        {/* 工作目录 */}
                        <div class="flex items-center gap-1 text-[11px] text-zinc-400 font-mono mb-3">
                          <Icons.Folder size={13} className="text-zinc-500" />
                          <span class="truncate">{s.path}</span>
                        </div>

                        {/* 2x2 Bento 便当盒数据格 */}
                        <div class="grid grid-cols-2 gap-2 bg-zinc-900/80 p-2.5 rounded-2xl border border-zinc-800/80 font-mono text-[11px] mb-2">
                          <div>
                            <div class="text-[10px] text-zinc-500">{t.contextLabel}</div>
                            <div class="text-zinc-200 font-medium">{s.ctxUsed}k / {s.ctxTotal}k ({s.ctxRatio}%)</div>
                          </div>
                          <div>
                            <div class="text-[10px] text-zinc-500">{t.tokensLabel}</div>
                            <div class="text-zinc-200 font-medium">{s.tokens} <span class="text-zinc-500">({s.cost})</span></div>
                          </div>
                          <div>
                            <div class="text-[10px] text-zinc-500">{t.cacheLabel}</div>
                            <div class="text-emerald-400 font-medium">{s.cache}%</div>
                          </div>
                          <div>
                            <div class="text-[10px] text-zinc-500">对话状态</div>
                            <div class="text-zinc-300">{s.msgs} msgs · {s.time}</div>
                          </div>
                        </div>

                        {/* 上下文进度条 */}
                        <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                          <div class="h-full bg-purple-500 rounded-full" style={{ width: `${s.ctxRatio}%` }}></div>
                        </div>
                      </div>
                    ))}

                    {/* --- 方向 C 的卡片：纯粹黑客终端 (Terminal Chic) --- */}
                    {direction === "C" && mockData.map((s) => (
                      <div
                        key={s.id}
                        onClick={() => setInDetail(true)}
                        class="p-3 bg-appCardC border border-zinc-800 font-mono text-xs hover:border-emerald-500/60 transition-all cursor-pointer"
                      >
                        <div class="flex items-center justify-between border-b border-zinc-800/80 pb-1.5 mb-2">
                          <span class="text-emerald-400 font-bold">[{s.status.toUpperCase()}] {s.name}</span>
                          <span class="text-zinc-400 text-[10px]">{s.model}</span>
                        </div>

                        <div class="text-zinc-500 text-[10px] truncate mb-2">
                          $ cd {s.path}
                        </div>

                        <div class="grid grid-cols-4 gap-1 text-[10px] text-zinc-300 border-t border-dashed border-zinc-800 pt-1.5">
                          <div><span class="text-zinc-500">CTX:</span> {s.ctxRatio}%</div>
                          <div><span class="text-zinc-500">TOK:</span> {s.tokens}</div>
                          <div><span class="text-zinc-500">HIT:</span> {s.cache}%</div>
                          <div><span class="text-zinc-500">MSG:</span> {s.msgs}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* 设置 Tab：通信与配对中枢 (优化项 6) */}
                {tab === "settings" && (
                  <div class="flex-1 overflow-y-auto px-4 pt-2 pb-28 space-y-4 no-scrollbar">
                    <div class="p-4 rounded-3xl bg-zinc-900/90 border border-zinc-800">
                      <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                          <Icons.Radio className="text-blue-400" />
                          <h3 class="font-bold text-sm text-white">{t.hubTitle}</h3>
                        </div>
                        <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-800">
                          CONNECTED
                        </span>
                      </div>
                      <p class="text-xs text-zinc-400 mb-3 leading-relaxed">{t.hubDesc}</p>

                      <div class="bg-black/50 p-3 rounded-2xl border border-zinc-800 font-mono text-[11px] space-y-1.5 mb-3">
                        <div class="flex justify-between text-zinc-400">
                          <span>{t.hubNode}:</span>
                          <span class="text-zinc-200">100.98.197.10:4739</span>
                        </div>
                        <div class="flex justify-between text-zinc-400">
                          <span>{t.hubHeartbeat}:</span>
                          <span class="text-emerald-400">20s Ping Active</span>
                        </div>
                        <div class="flex justify-between text-zinc-400">
                          <span>{t.hubBackpressure}:</span>
                          <span class="text-zinc-300">Bounded 32MB / 1013</span>
                        </div>
                      </div>

                      <div class="flex gap-2">
                        <button class="flex-1 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 flex items-center justify-center gap-1.5">
                          <Icons.Refresh size={13} />
                          <span>{t.btnRefresh}</span>
                        </button>
                        <button class="flex-1 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white flex items-center justify-center gap-1.5 shadow">
                          <Icons.QrCode size={14} />
                          <span>{t.btnScan}</span>
                        </button>
                      </div>
                    </div>

                    <div class="p-3.5 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 text-xs space-y-2 text-zinc-300">
                      <div class="flex justify-between">
                        <span>当前版本</span>
                        <span class="font-mono text-zinc-400">v0.2.15 (Build 15)</span>
                      </div>
                      <div class="flex justify-between">
                        <span>边缘滑动返回手势</span>
                        <span class="text-emerald-400 font-mono">Enabled</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* 工作台与监控占位 */}
                {(tab === "workbench" || tab === "monitor") && (
                  <div class="flex-1 flex flex-col items-center justify-center text-center p-6 text-zinc-500 font-mono text-xs">
                    <div class="p-3 rounded-full bg-zinc-900 border border-zinc-800 mb-2">
                      {tab === "workbench" ? <Icons.Workbench size={24} className="text-zinc-400" /> : <Icons.Monitor size={24} className="text-zinc-400" />}
                    </div>
                    <p class="text-zinc-300 font-bold">{tab === "workbench" ? "任务工作台" : "主机集群监控"}</p>
                    <p class="text-zinc-500 mt-1">支持左右横划手势直接切回会话</p>
                  </div>
                )}

                {/* ========================================================================= */}
                {/* 浮动工具栏 Floating Toolbar (优化项 4 & 5) */}
                {/* ========================================================================= */}
                {tab === "sessions" && (
                  <div class="absolute bottom-20 inset-x-0 flex justify-center z-40 px-4 pointer-events-none">
                    {/* 方案 A: 极客紧凑药丸流体岛 */}
                    {direction === "A" && (
                      <div class="glass-pill border border-zinc-700/80 shadow-2xl rounded-full p-1 flex items-center gap-1 pointer-events-auto">
                        <button
                          onClick={() => setFilter("active")}
                          class={`px-3 py-1 rounded-full text-xs font-medium transition-all ${
                            filter === "active" ? "bg-blue-600 text-white font-bold" : "text-zinc-400"
                          }`}
                        >
                          {t.filterActive}
                        </button>
                        <button
                          onClick={() => setFilter("all")}
                          class={`px-3 py-1 rounded-full text-xs font-medium transition-all ${
                            filter === "all" ? "bg-zinc-800 text-white font-bold" : "text-zinc-400"
                          }`}
                        >
                          {t.filterAll}
                        </button>
                        <div class="w-[1px] h-3.5 bg-zinc-700 mx-1"></div>
                        <button 
                          onClick={() => setSearchActive(!searchActive)}
                          class="p-1.5 text-zinc-400 hover:text-white rounded-full"
                        >
                          <Icons.Search size={14} />
                        </button>
                      </div>
                    )}

                    {/* 方案 B: MIUIX 大圆角毛玻璃工具条 */}
                    {direction === "B" && (
                      <div class="glass-pill border border-purple-500/30 shadow-2xl rounded-2xl px-3 py-1.5 flex items-center gap-2 pointer-events-auto">
                        <button
                          onClick={() => setFilter("active")}
                          class={`px-3 py-1 rounded-xl text-xs font-semibold ${
                            filter === "active" ? "bg-purple-600 text-white" : "text-zinc-400"
                          }`}
                        >
                          {t.filterActive}
                        </button>
                        <button
                          onClick={() => setFilter("all")}
                          class={`px-3 py-1 rounded-xl text-xs font-semibold ${
                            filter === "all" ? "bg-zinc-800 text-zinc-200" : "text-zinc-400"
                          }`}
                        >
                          {t.filterAll}
                        </button>
                        <div class="w-[1px] h-4 bg-zinc-700"></div>
                        <input
                          type="text"
                          placeholder="过滤..."
                          class="bg-black/40 border border-zinc-700/60 rounded-xl px-2 py-0.5 text-xs text-white w-20 focus:outline-none"
                        />
                      </div>
                    )}

                    {/* 方案 C: 终端 Vim Statusline 浮动条 */}
                    {direction === "C" && (
                      <div class="bg-black border border-emerald-500/60 shadow-2xl p-1 flex items-center gap-2 pointer-events-auto font-mono text-[10px]">
                        <span class="bg-emerald-600 text-black px-1.5 py-0.5 font-bold">:FILTER</span>
                        <button onClick={() => setFilter("active")} class={filter === "active" ? "text-emerald-400 underline font-bold" : "text-zinc-400"}>[ACTIVE]</button>
                        <button onClick={() => setFilter("all")} class={filter === "all" ? "text-emerald-400 underline font-bold" : "text-zinc-400"}>[ALL]</button>
                        <span class="text-zinc-600">/</span>
                        <span class="text-zinc-400">FIND: _</span>
                      </div>
                    )}
                  </div>
                )}

                {/* 底部 Dock 栏（优化项 1: 支持横滑切换） */}
                <div class="h-16 glass-dock border-t border-zinc-800/80 flex items-center justify-around px-2 z-40">
                  {[
                    { id: "workbench", label: t.tabWorkbench, Icon: Icons.Workbench },
                    { id: "sessions", label: t.tabSessions, Icon: Icons.Chat },
                    { id: "monitor", label: t.tabMonitor, Icon: Icons.Monitor },
                    { id: "settings", label: t.tabSettings, Icon: Icons.Settings },
                  ].map((item) => {
                    const active = tab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setTab(item.id)}
                        class={`flex flex-col items-center justify-center flex-1 py-1 transition-all ${
                          active ? "text-blue-400 font-bold scale-105" : "text-zinc-500 hover:text-zinc-300"
                        }`}
                      >
                        <item.Icon size={18} className="mb-0.5" />
                        <span class="text-[10px] tracking-tight">{item.label}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* ========================================================================= */}
              {/* 二级页面：详细会话页 (优化项 2: 最小化不跳错 + 优化项 3: 边缘右滑返回) */}
              {/* ========================================================================= */}
              <div class={`absolute inset-0 bg-appDark flex flex-col z-50 transition-all duration-300 ${
                inDetail ? "translate-x-0 opacity-100" : "translate-x-full opacity-0 pointer-events-none"
              }`}>
                
                {/* 详情页 Header */}
                <div class="px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between glass-dock">
                  {/* 左上角最小化：返回会话列表，绝不跳工作台 */}
                  <button
                    onClick={() => setInDetail(false)}
                    class="flex items-center gap-1 px-2.5 py-1 rounded-xl bg-zinc-900 border border-zinc-700/80 text-zinc-300 text-xs font-medium hover:text-white"
                  >
                    <Icons.Minimize size={13} />
                    <span>{t.backBtn}</span>
                  </button>

                  <div class="text-center">
                    <h2 class="text-xs font-bold text-zinc-100 font-mono">pi-maestro-app-party</h2>
                    <span class="text-[10px] text-emerald-400 font-mono">● {t.statusStreaming}</span>
                  </div>

                  <div class="w-12 flex justify-end">
                    <Icons.Settings size={15} className="text-zinc-500" />
                  </div>
                </div>

                {/* 边缘右滑返回引导提示 */}
                <div class="bg-blue-950/40 border-b border-blue-900/30 px-4 py-1 text-[10px] text-blue-300 flex items-center justify-between font-mono">
                  <span>{t.swipeBackHint}</span>
                  <span>可拖拽返回</span>
                </div>

                {/* 聊天内容区：真实展示 Bug 1、Bug 2、Bug 3 修复效果 */}
                <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
                  
                  {/* 用户气泡（单条渲染） */}
                  <div class="flex justify-end">
                    <div class="max-w-[80%] bg-blue-600 text-white px-3.5 py-2 rounded-2xl rounded-tr-xs text-xs shadow-md">
                      ios 消息测试
                    </div>
                  </div>

                  {/* 大模型回复气泡 */}
                  <div class="flex justify-start">
                    <div class="max-w-[92%] bg-zinc-900 border border-zinc-800 text-zinc-200 p-4 rounded-2xl rounded-tl-xs text-xs space-y-2.5">
                      
                      <p class="leading-relaxed">
                        {t.testPrompt}
                        {/* Bug 2 修复：嵌套加粗代码块 */}
                        <span class="inline-block px-1.5 py-0.5 rounded bg-zinc-800 text-blue-300 font-mono font-bold border border-zinc-700">
                          {t.testTag}
                        </span>
                        ！
                      </p>

                      <p class="font-medium text-zinc-300">{t.testSub}</p>

                      {/* Bug 1 修复展示：有序列表后面文字完整保留 */}
                      <div class="space-y-1.5 pl-2 border-l-2 border-blue-500/50 my-2">
                        <div class="flex items-start gap-1.5 text-zinc-200">
                          <span class="text-blue-400 font-mono font-bold">1.</span>
                          <span>{t.test1}</span>
                        </div>
                        <div class="flex items-start gap-1.5 text-zinc-200">
                          <span class="text-blue-400 font-mono font-bold">2.</span>
                          <span>{t.test2}</span>
                        </div>
                      </div>

                      {/* Bug 3 修复展示：带 # 符号与层级强调色的标题 */}
                      <div class="pt-2 border-t border-zinc-800/80">
                        <div class="text-sm font-bold text-white flex items-center gap-1.5">
                          <span class="text-blue-400 font-mono font-semibold">###</span>
                          <span>{t.titleDemo}</span>
                        </div>
                        <p class="text-[11px] text-zinc-400 mt-1 leading-relaxed">
                          采用轻量单色 SVG 替换所有 emoji 装饰，数据矩阵与单手 Floating 岛全面提升极客操作质感。
                        </p>
                      </div>

                    </div>
                  </div>
                </div>

                {/* 底部输入框 */}
                <div class="p-3 border-t border-zinc-800 glass-dock flex items-center gap-2">
                  <input
                    type="text"
                    placeholder="输入指令..."
                    class="flex-1 bg-black/60 border border-zinc-700/80 rounded-full px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                  />
                  <button class="w-8 h-8 rounded-full bg-blue-600 hover:bg-blue-500 flex items-center justify-center text-white text-xs shadow-md">
                    <Icons.Send size={13} />
                  </button>
                </div>
              </div>

            </div>

            {/* iOS 底部 Home Indicator */}
            <div class="h-5 flex items-center justify-center z-50">
              <div class="w-32 h-1 bg-zinc-600 rounded-full"></div>
            </div>
          </div>

          {/* 操作提示与说明 */}
          <div class="mt-6 text-xs text-zinc-400 text-center space-y-1">
            <p class="text-zinc-200 font-semibold">交互测试点：</p>
            <p>1. 顶部切换 <span class="text-blue-400">方案 A</span> / <span class="text-purple-400">方案 B</span> / <span class="text-emerald-400">方案 C</span> 对比三种截然不同的卡片与结构布局。</p>
            <p>2. 点击任意卡片进入详情页，体验左上角“收起并返回”（精准回退会话，不跳工作台）或左侧向右拖拽返回。</p>
            <p>3. 全面移除彩色 emoji，统一换为纯色线性 SVG 图标，视觉更干练沉着。</p>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
