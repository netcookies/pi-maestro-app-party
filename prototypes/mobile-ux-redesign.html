  <!-- React & Babel CDN -->

        extend: {

            iosCard: '#16191E',

            iosAccent: '#388BFD',
            iosAccentGreen: '#2EA043',
            iosAccentOrange: '#DB6D28',

  <style>
    body {
      background-color: #06080A;
      color: #E6EDF3;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    /* 仿 iPhone 16 Pro 外壳阴影 */
    .iphone-frame {
      width: 400px;
      height: 844px;
      border-radius: 54px;
      box-shadow: 0 0 0 12px #1E2229, 0 0 0 14px #0F1216, 0 25px 65px rgba(0,0,0,0.85);
      position: relative;
      overflow: hidden;
    }
    /* 隐藏滚动条但保留滚动功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 动态毛玻璃 */
    .glass {
      background: rgba(22, 25, 30, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-light {
      background: rgba(35, 39, 47, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    /* 平滑过渡 */
    .view-transition {
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen py-8">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 国际化双语字典 ---
    const i18n = {
      zh: {
        dirA: "方向 A · 动态流体岛 (Dynamic Fluid)",
        dirB: "方向 B · HyperOS 质感工坊 (MIUIX Pure)",
        dirC: "方向 C · 终端极客朋克 (Terminal Chic)",
        tabWorkbench: "工作台",
        tabSessions: "会话",
        tabMonitor: "监控",
        tabSettings: "设置",
        filterActive: "活跃",
        filterAll: "全部",
        searchPlaceholder: "搜索会话、目录或指令...",
        sessionsCount: "共 4 个运行中任务",
        statusStreaming: "流式生成中",
        statusActive: "活跃就绪",
        statusIdle: "等待接入",
        tokens: "Token用量",
        context: "上下文视窗",
        cacheHit: "缓存命中",
        messages: "条消息",
        updatedJustNow: "刚刚活跃",
        updatedMinAgo: "3分钟前",
        connSettingTitle: "通信与配对中枢",
        connStatusConnected: "已安全连接至 Mac 桌面 Host",
        connIp: "当前节点",
        reconnectBtn: "刷新连接",
        pairBtn: "重新扫码配对",
        detailTitle: "详细会话",
        backToList: "收起会话",
        swipeBackHint: "← 屏幕左缘向右滑动返回",
        langToggle: "English",
        testMsg1: "请看此时手机端屏幕：",
        testItem1: "是否只渲染了一次（不再出现两条一模一样的蓝色用户气泡）？",
        testItem2: "当前这条回复的流式输出是否依然流畅同屏打字？",
        headingSample: "### 根因与修复结论"
      },
      en: {
        dirA: "Direction A · Dynamic Fluid Island",
        dirB: "Direction B · HyperOS Craft (MIUIX)",
        dirC: "Direction C · Terminal Chic (TUI Punk)",
        tabWorkbench: "Workbench",
        tabSessions: "Sessions",
        tabMonitor: "Monitor",
        tabSettings: "Settings",
        filterActive: "Active",
        filterAll: "All",
        searchPlaceholder: "Search sessions, paths or commands...",
        sessionsCount: "4 active tasks running",
        statusStreaming: "Streaming",
        statusActive: "Active Ready",
        statusIdle: "Idle",
        tokens: "Tokens",
        context: "Context Window",
        cacheHit: "Cache Hit",
        messages: "msgs",
        updatedJustNow: "Just now",
        updatedMinAgo: "3m ago",
        connSettingTitle: "Connection & Pairing Hub",
        connStatusConnected: "Securely connected to Mac Host",
        connIp: "Connected Node",
        reconnectBtn: "Reconnect",
        pairBtn: "Scan QR Code",
        detailTitle: "Session Detail",
        backToList: "Minimize",
        swipeBackHint: "← Swipe from left edge to back",
        langToggle: "中文",
        testMsg1: "Check your phone screen now:",
        testItem1: "Rendered only once (no duplicate bubbles)?",
        testItem2: "Is the live stream typing smooth?",
        headingSample: "### Root Cause & Resolution"
      }
    };

    // --- 模拟真实会话数据 ---
    const mockSessions = [
      {
        id: "s1",
        title: "pi-maestro-app-party",
        cwd: "~/Projects/pi-maestro-app-party",
        model: "gemini-3.8-flash",
        status: "streaming",
        statusColor: "emerald",
        messagesCount: 42,
        contextTokens: 164,
        contextMax: 1000,
        contextPercent: 16.4,
        cacheRate: 78,
        totalTokens: "885k",
        cost: "$0.68",
        lastActive: "justNow"
      },
      {
        id: "s2",
        title: "WorkSpace4AI / maestro-core",
        cwd: "~/Projects/WorkSpace4AI",
        model: "gpt-5.6-sol",
        status: "active",
        statusColor: "blue",
        messagesCount: 128,
        contextTokens: 412,
        contextMax: 1000,
        contextPercent: 41.2,
        cacheRate: 92,
        totalTokens: "2.4M",
        cost: "$1.85",
        lastActive: "minAgo"
      },
      {
        id: "s3",
        title: "isulewTools-app / Android",
        cwd: "~/AndroidStudioProjects/isulewTools",
        model: "claude-sonnet-4-6",
        status: "idle",
        statusColor: "zinc",
        messagesCount: 19,
        contextTokens: 85,
        contextMax: 200,
        contextPercent: 42.5,
        cacheRate: 64,
        totalTokens: "340k",
        cost: "$0.42",
        lastActive: "minAgo"
      }
    ];

    function App() {
      // 当前设计方向: 'A' | 'B' | 'C'
      const [direction, setDirection] = useState("A");
      // 当前主 Tab: 'workbench' | 'sessions' | 'monitor' | 'settings'
      const [activeTab, setActiveTab] = useState("sessions");
      // 语言: 'zh' | 'en'
      const [lang, setLang] = useState("zh");
      // 会话列表筛选: 'active' | 'all'
      const [filter, setFilter] = useState("active");
      // 是否正在会话详情页（二级页面）
      const [inDetail, setInDetail] = useState(false);
      // Floating 搜索栏展开态
      const [searchExpanded, setSearchExpanded] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      // 模拟手势滑动位移
      const [swipeOffset, setSwipeOffset] = useState(0);
      const [isSwiping, setIsSwiping] = useState(false);
      const touchStartX = useRef(0);
      const touchStartY = useRef(0);

      const t = i18n[lang];

      // 处理全屏左右滑动切换 Tab（仅在一级页面生效）
      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
        setIsSwiping(true);
      };

      const handleTouchMove = (e) => {
        if (!isSwiping) return;
        const deltaX = e.touches[0].clientX - touchStartX.current;
        const deltaY = Math.abs(e.touches[0].clientY - touchStartY.current);
        // 如果主要是横向滑动
        if (deltaY < 30) {
          setSwipeOffset(deltaX);
        }
      };

      const handleTouchEnd = () => {
        if (!isSwiping) return;
        setIsSwiping(false);
        const tabs = ["workbench", "sessions", "monitor", "settings"];
        const currentIndex = tabs.indexOf(activeTab);

        if (inDetail) {
          // 在二级详情页：从左边缘向右滑动超过 75px 则触发返回
          if (swipeOffset > 75) {
            setInDetail(false);
          }
          setSwipeOffset(0);
          return;
        }

        // 一级页面手势切换 Dock 栏
        if (swipeOffset < -60 && currentIndex < tabs.length - 1) {
          setActiveTab(tabs[currentIndex + 1]);
        } else if (swipeOffset > 60 && currentIndex > 0) {
          setActiveTab(tabs[currentIndex - 1]);
        }
        setSwipeOffset(0);
      };

      return (
        <div class="flex flex-col items-center w-full">
          {/* 顶部控制台：三方向切换与语言切换 */}
          <div class="w-full max-w-4xl mb-6 flex flex-col md:flex-row items-center justify-between gap-4 px-4">
            <div class="flex items-center gap-2 bg-iosCard p-1.5 rounded-2xl border border-iosBorder shadow-lg">
              <span class="text-xs font-semibold px-2 text-zinc-400">选择方案方向：</span>
              <button
                onClick={() => setDirection("A")}
                class={`px-3 py-1.5 rounded-xl text-xs font-medium transition-all ${
                  direction === "A" ? "bg-iosAccent text-white shadow-md font-bold" : "text-zinc-400 hover:text-zinc-200"
                }`}
              >
                方案 A · 动态流体岛 (Dynamic Fluid)
              </button>
              <button
                onClick={() => setDirection("B")}
                class={`px-3 py-1.5 rounded-xl text-xs font-medium transition-all ${
                  direction === "B" ? "bg-purple-600 text-white shadow-md font-bold" : "text-zinc-400 hover:text-zinc-200"
                }`}
              >
                方案 B · HyperOS 质感工坊 (MIUIX)
              </button>
              <button
                onClick={() => setDirection("C")}
                class={`px-3 py-1.5 rounded-xl text-xs font-medium transition-all ${
                  direction === "C" ? "bg-amber-600 text-white shadow-md font-bold" : "text-zinc-400 hover:text-zinc-200"
                }`}
              >
                方案 C · 终端极客朋克 (TUI Chic)
              </button>
            </div>

            <div class="flex items-center gap-3">
              <button
                onClick={() => setLang(lang === "zh" ? "en" : "zh")}
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-iosCard border border-iosBorder text-xs text-zinc-300 hover:border-zinc-500 transition-all font-mono"
              >
                <span>🌐 {t.langToggle}</span>
              </button>
              <div class="text-xs text-zinc-400 bg-zinc-900/80 px-3 py-1.5 rounded-xl border border-zinc-800">
                可直接在手机框内点击体验
              </div>
            </div>
          </div>

          {/* 方案特性速览标签 */}
          <div class="text-xs text-zinc-400 mb-4 text-center max-w-xl">
            {direction === "A" && "💡 方案 A 特点：极客轻量，底部收纳 Floating Toolbar，搜索框流体伸缩，卡片采用芯片化密集布局，单手操作最佳。"}
            {direction === "B" && "💡 方案 B 特点：HyperOS / MIUIX 优雅大圆角与毛玻璃，分层网格卡片，双端连接状态专卡专屏，视觉温润秩序感强。"}
            {direction === "C" && "💡 方案 C 特点：TUI 终端映射设计，Monospace 数据矩阵，Vim 式底部状态胶囊，霓虹指标点，硬核极客风。"}
          </div>

          {/* --- iPhone 16 Pro 仿真机框容器 --- */}
          <div 
            class="iphone-frame bg-iosBg border border-zinc-800 flex flex-col"
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
          >
            {/* iOS 顶栏与灵动岛 Dynamic Island */}
            <div class="w-full h-12 pt-3 px-7 flex items-center justify-between z-50 select-none">
              <span class="text-xs font-semibold tracking-tight text-zinc-300">9:41</span>
              {/* 灵动岛 (带绿色指示灯修复演示) */}
              <div class="w-28 h-7 bg-black rounded-full flex items-center justify-between px-2.5 shadow-inner">
                <div class="w-2.5 h-2.5 rounded-full bg-zinc-900"></div>
                <div class="flex items-center gap-1">
                  {/* 扫码修复后：不再常亮绿色圆点，相机完全关闭 */}
                  <div class="w-2 h-2 rounded-full bg-transparent"></div>
                  <div class="w-2.5 h-2.5 rounded-full bg-blue-500/80 animate-pulse"></div>
                </div>
              </div>
              <div class="flex items-center gap-1.5 text-zinc-300 text-xs">
                <span>5G</span>
                <span class="w-5 h-2.5 border border-zinc-400 rounded-sm p-0.5 flex items-center">
                  <span class="w-3 h-1.5 bg-zinc-300 rounded-xs"></span>
                </span>
              </div>
            </div>

            {/* --- 主屏内容区 --- */}
            <div class="flex-1 relative overflow-hidden flex flex-col">
              
              {/* 视图 1：主导航与会话列表 (一级页面) */}
              <div class={`absolute inset-0 flex flex-col transition-all duration-300 ${
                inDetail ? "-translate-x-full opacity-0 pointer-events-none" : "translate-x-0 opacity-100"
              }`}>
                {/* 顶栏 Header */}
                <div class="px-5 pt-2 pb-3 flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-sm text-white shadow-md">
                      M
                    </div>
                    <div>
                      <h1 class="text-base font-bold tracking-tight text-white leading-tight">
                        {activeTab === "sessions" && t.tabSessions}
                        {activeTab === "workbench" && t.tabWorkbench}
                        {activeTab === "monitor" && t.tabMonitor}
                        {activeTab === "settings" && t.tabSettings}
                      </h1>
                      <p class="text-[11px] text-zinc-400 font-mono">
                        {activeTab === "sessions" && t.sessionsCount}
                        {activeTab === "settings" && "v0.2.15 (Build 15)"}
                      </p>
                    </div>
                  </div>

                  {/* 状态指示徽标 */}
                  <div class="flex items-center gap-1.5 bg-emerald-950/60 border border-emerald-800/60 px-2.5 py-1 rounded-full text-[11px] text-emerald-400 font-medium">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Host Online</span>
                  </div>
                </div>

                {/* 会话列表页面 (activeTab === 'sessions') */}
                {activeTab === "sessions" && (
                  <div class="flex-1 overflow-y-auto px-4 pb-28 space-y-3 no-scrollbar">
                    
                    {/* 会话卡片列表 (统一规范展示 8 大要素) */}
                    {mockSessions.map((session) => (
                      <div
                        key={session.id}
                        onClick={() => setInDetail(true)}
                        class={`p-3.5 rounded-2xl border transition-all cursor-pointer ${
                          direction === "A" 
                            ? "bg-iosCard border-iosBorder hover:border-blue-500/50 active:scale-[0.98]"
                            : direction === "B"
                            ? "bg-[#181B22] border-zinc-800/80 shadow-md hover:border-purple-500/50"
                            : "bg-[#111317] border-zinc-800 font-mono hover:border-amber-500/50"
                        }`}
                      >
                        {/* 1. 顶部行：状态图标 + 标题 + 模型Badge */}
                        <div class="flex items-center justify-between mb-2">
                          <div class="flex items-center gap-2 min-w-0">
                            <span class={`w-2.5 h-2.5 rounded-full ${
                              session.status === "streaming" ? "bg-emerald-400 shadow-[0_0_8px_#34d399]" :
                              session.status === "active" ? "bg-blue-400" : "bg-zinc-500"
                            }`}></span>
                            <span class="font-semibold text-sm text-zinc-100 truncate">{session.title}</span>
                          </div>
                          <span class="text-[10px] px-2 py-0.5 rounded-md bg-zinc-800/90 text-zinc-300 font-mono border border-zinc-700/60 shrink-0">
                            {session.model}
                          </span>
                        </div>

                        {/* 2. 中间行：工作目录 */}
                        <div class="flex items-center gap-1 text-[11px] text-zinc-400 font-mono truncate mb-2.5">
                          <span class="text-zinc-500">📁</span>
                          <span class="truncate">{session.cwd}</span>
                        </div>

                        {/* 3. 上下文进度条 (Context Window) */}
                        <div class="mb-2.5">
                          <div class="flex justify-between text-[10px] text-zinc-400 mb-1 font-mono">
                            <span>{t.context}</span>
                            <span class="text-zinc-300">{session.contextTokens}k / {session.contextMax}k ({session.contextPercent}%)</span>
                          </div>
                          <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                            <div 
                              class={`h-full rounded-full ${
                                session.contextPercent > 80 ? "bg-red-500" :
                                session.contextPercent > 50 ? "bg-amber-500" : "bg-blue-500"
                              }`}
                              style={{ width: `${session.contextPercent}%` }}
                            ></div>
                          </div>
                        </div>

                        {/* 4. 底部网格数据：消息条数 · 缓存率 · Token · 活跃时间 */}
                        <div class="pt-2 border-t border-zinc-800/80 flex items-center justify-between text-[11px] text-zinc-400 font-mono">
                          <div class="flex items-center gap-3">
                            <span>💬 {session.messagesCount} {t.messages}</span>
                            <span>⚡ {t.cacheHit} {session.cacheRate}%</span>
                          </div>
                          <div class="flex items-center gap-2 text-zinc-300 font-medium">
                            <span>🪙 {session.totalTokens}</span>
                            <span class="text-[10px] text-zinc-500">({session.cost})</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* 设置页面 (activeTab === 'settings')：集成【通信与配对中枢】 */}
                {activeTab === "settings" && (
                  <div class="flex-1 overflow-y-auto px-4 pb-28 space-y-4 no-scrollbar">
                    {/* 通信与连接状态整合专卡 */}
                    <div class="p-4 rounded-2xl bg-gradient-to-b from-blue-950/40 to-iosCard border border-blue-900/50">
                      <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                          <span class="text-lg">📡</span>
                          <h3 class="font-bold text-sm text-white">{t.connSettingTitle}</h3>
                        </div>
                        <span class="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded-full">
                          Connected
                        </span>
                      </div>

                      <p class="text-xs text-zinc-300 mb-3">{t.connStatusConnected}</p>

                      <div class="bg-black/40 rounded-xl p-3 border border-zinc-800/80 mb-3 space-y-1.5 font-mono text-[11px]">
                        <div class="flex justify-between text-zinc-400">
                          <span>{t.connIp}:</span>
                          <span class="text-zinc-200">100.98.197.10:4739</span>
                        </div>
                        <div class="flex justify-between text-zinc-400">
                          <span>心跳保活机制:</span>
                          <span class="text-emerald-400">20s App-Ping (Active)</span>
                        </div>
                        <div class="flex justify-between text-zinc-400">
                          <span>WebSocket背压:</span>
                          <span class="text-zinc-300">Bounded 32MB</span>
                        </div>
                      </div>

                      <div class="flex gap-2">
                        <button class="flex-1 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 transition-all border border-zinc-700">
                          {t.reconnectBtn}
                        </button>
                        <button class="flex-1 py-2 rounded-xl bg-iosAccent hover:bg-blue-600 text-xs font-semibold text-white transition-all shadow-md">
                          {t.pairBtn}
                        </button>
                      </div>
                    </div>

                    {/* 其他通用设置 */}
                    <div class="bg-iosCard rounded-2xl border border-iosBorder divide-y divide-zinc-800/80 text-xs">
                      <div class="p-3.5 flex justify-between items-center text-zinc-300">
                        <span>语言 / Language</span>
                        <span class="text-zinc-500 font-mono">{lang === "zh" ? "简体中文" : "English"}</span>
                      </div>
                      <div class="p-3.5 flex justify-between items-center text-zinc-300">
                        <span>主题外观</span>
                        <span class="text-zinc-500">深色 OLED 黑</span>
                      </div>
                      <div class="p-3.5 flex justify-between items-center text-zinc-300">
                        <span>手势导航</span>
                        <span class="text-emerald-400 font-medium">已启用边缘返回</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* 工作台与监控占位态 */}
                {(activeTab === "workbench" || activeTab === "monitor") && (
                  <div class="flex-1 flex flex-col items-center justify-center text-center p-6 text-zinc-500">
                    <span class="text-4xl mb-2">{activeTab === "workbench" ? "🛠️" : "📊"}</span>
                    <p class="text-sm font-medium text-zinc-300">
                      {activeTab === "workbench" ? "工作台待办与计划流水线" : "Host 全局会话实时监控"}
                    </p>
                    <p class="text-xs text-zinc-500 mt-1">支持横向手势左滑/右滑快速切换回会话</p>
                  </div>
                )}

                {/* --- 浮动工具栏 Floating Toolbar (优化项 4 & 5) --- */}
                {activeTab === "sessions" && (
                  <div class="absolute bottom-20 inset-x-0 flex justify-center z-40 px-4 pointer-events-none">
                    <div class={`glass border shadow-2xl rounded-full p-1.5 flex items-center gap-1.5 pointer-events-auto transition-all ${
                      direction === "A" ? "border-blue-500/40 w-auto" :
                      direction === "B" ? "border-zinc-700/80 rounded-2xl px-2" :
                      "border-amber-500/40 font-mono text-[11px] rounded-lg"
                    }`}>
                      {/* 活跃 / 全部 紧凑药丸切换 */}
                      <button
                        onClick={() => setFilter("active")}
                        class={`px-3 py-1 rounded-full text-xs font-semibold transition-all ${
                          filter === "active" 
                            ? "bg-blue-600 text-white shadow" 
                            : "text-zinc-400 hover:text-zinc-200"
                        }`}
                      >
                        ⚡ {t.filterActive}
                      </button>
                      <button
                        onClick={() => setFilter("all")}
                        class={`px-3 py-1 rounded-full text-xs font-semibold transition-all ${
                          filter === "all" 
                            ? "bg-zinc-700 text-white shadow" 
                            : "text-zinc-400 hover:text-zinc-200"
                        }`}
                      >
                        📁 {t.filterAll}
                      </button>

                      <div class="w-[1px] h-4 bg-zinc-700 mx-0.5"></div>

                      {/* 搜索按钮 / 展开输入框 */}
                      {!searchExpanded ? (
                        <button
                          onClick={() => setSearchExpanded(true)}
                          class="p-1.5 text-zinc-400 hover:text-white rounded-full transition-all"
                          title="搜索"
                        >
                          🔍
                        </button>
                      ) : (
                        <div class="flex items-center gap-1 bg-black/40 rounded-full px-2 py-0.5 border border-zinc-700">
                          <input
                            type="text"
                            placeholder="过滤..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            class="bg-transparent text-xs text-white focus:outline-none w-20"
                            autoFocus
                          />
                          <button onClick={() => setSearchExpanded(false)} class="text-zinc-500 text-xs px-1">✕</button>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* --- 底部 Dock 导航栏 (优化项 1: 支持左右手势) --- */}
                <div class="h-16 glass border-t border-iosBorder flex items-center justify-around px-2 z-40">
                  {[
                    { id: "workbench", label: t.tabWorkbench, icon: "🛠️" },
                    { id: "sessions", label: t.tabSessions, icon: "💬" },
                    { id: "monitor", label: t.tabMonitor, icon: "📊" },
                    { id: "settings", label: t.tabSettings, icon: "⚙️" },
                  ].map((tab) => {
                    const isSelected = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        class={`flex flex-col items-center justify-center flex-1 py-1 transition-all ${
                          isSelected ? "text-iosAccent font-semibold scale-105" : "text-zinc-400 hover:text-zinc-200"
                        }`}
                      >
                        <span class="text-lg leading-tight mb-0.5">{tab.icon}</span>
                        <span class="text-[10px] tracking-tight">{tab.label}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 视图 2：详细会话页 (二级页面，优化项 2 & 3: 最小化回会话 + 边缘右滑返回) */}
              <div class={`absolute inset-0 bg-iosBg flex flex-col z-50 transition-all duration-300 ${
                inDetail ? "translate-x-0 opacity-100" : "translate-x-full opacity-0 pointer-events-none"
              }`}>
                {/* 详情页 Header */}
                <div class="px-4 py-3 border-b border-iosBorder flex items-center justify-between glass">
                  {/* 左上角最小化按钮：精准回到会话列表，不跳工作台 */}
                  <button
                    onClick={() => setInDetail(false)}
                    class="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 text-xs font-medium border border-zinc-700/80"
                  >
                    <span>↙</span>
                    <span>{t.backToList}</span>
                  </button>

                  <div class="text-center">
                    <h2 class="text-xs font-bold text-white leading-tight">pi-maestro-app-party</h2>
                    <span class="text-[10px] text-emerald-400 font-mono">● {t.statusStreaming}</span>
                  </div>

                  <button class="w-7 h-7 flex items-center justify-center text-zinc-400 hover:text-white text-xs">
                    ⚙️
                  </button>
                </div>

                {/* 边缘滑动返回视觉引导 */}
                <div class="bg-blue-950/40 border-b border-blue-900/30 px-4 py-1 text-[10px] text-blue-400 flex items-center justify-between">
                  <span>{t.swipeBackHint}</span>
                  <span>可拖拽体验</span>
                </div>

                {/* 聊天气泡与修复效果展示区 (验证 Bug 1, 2, 3) */}
                <div class="flex-1 overflow-y-auto p-4 space-y-3.5 no-scrollbar">
                  {/* 1. 用户提问气泡 (单次渲染，彻底消除两条重复) */}
                  <div class="flex justify-end">
                    <div class="max-w-[80%] bg-blue-600 text-white px-3.5 py-2 rounded-2xl rounded-tr-xs text-xs shadow-md">
                      ios 消息测试
                    </div>
                  </div>

                  {/* 2. 大模型回复气泡 (完整展示修复后的列表项与格式) */}
                  <div class="flex justify-start">
                    <div class="max-w-[90%] bg-iosCard border border-iosBorder text-zinc-200 p-3.5 rounded-2xl rounded-tl-xs text-xs space-y-2 shadow-md">
                      <p class="leading-relaxed">
                        收到你的最新 iPhone 消息：
                        {/* Bug 2 修复展示：嵌套加粗与代码块同时生效 */}
                        <span class="inline-block px-1.5 py-0.5 rounded bg-zinc-800 text-blue-300 font-mono font-bold border border-zinc-700">
                          ios 消息测试
                        </span>
                        ！
                      </p>

                      <p class="font-medium text-zinc-300">{t.testMsg1}</p>

                      {/* Bug 1 修复展示：列表序号后内容完整保留，不再只剩 1 和 2 */}
                      <div class="space-y-1.5 pl-1 border-l-2 border-blue-500/40 my-2">
                        <div class="flex items-start gap-1.5 text-zinc-200">
                          <span class="text-blue-400 font-mono font-bold">1.</span>
                          <span>{t.testItem1}</span>
                        </div>
                        <div class="flex items-start gap-1.5 text-zinc-200">
                          <span class="text-blue-400 font-mono font-bold">2.</span>
                          <span>{t.testItem2}</span>
                        </div>
                      </div>

                      {/* Bug 3 修复展示：富有层级颜色的 # 标题与段落 */}
                      <div class="pt-2 border-t border-zinc-800">
                        <div class="text-sm font-bold text-white flex items-center gap-1">
                          <span class="text-blue-400 font-mono font-semibold">###</span>
                          <span>{t.headingSample}</span>
                        </div>
                        <p class="text-[11px] text-zinc-400 mt-1">
                          通过 JsonlTailWatcher 单一广播出口 + app-state 幂等防重，单条双发问题已彻底解决。
                        </p>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 底部输入栏 */}
                <div class="p-3 border-t border-iosBorder glass flex items-center gap-2">
                  <button class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white text-xs">
                    📎
                  </button>
                  <input
                    type="text"
                    placeholder="输入指令或消息..."
                    class="flex-1 bg-black/50 border border-zinc-800 rounded-full px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                  />
                  <button class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs shadow-md">
                    ↑
                  </button>
                </div>
              </div>

            </div>

            {/* iOS 底部小黑条 Home Indicator */}
            <div class="w-full h-6 flex items-center justify-center z-50">
              <div class="w-32 h-1 bg-zinc-500/60 rounded-full"></div>
            </div>
          </div>

          {/* 底部交互提示指南 */}
          <div class="mt-8 text-xs text-zinc-400 max-w-xl text-center space-y-1">
            <p class="text-zinc-300 font-semibold">🎮 交互体验指引：</p>
            <p>1. 切换方案：点击顶部 <span class="text-blue-400">方案 A</span> / <span class="text-purple-400">方案 B</span> / <span class="text-amber-400">方案 C</span> 立即体验不同流派样式。</p>
            <p>2. 体验会话详情：在“会话”Tab 点击任意卡片直接滑入，查看修复后的列表 1. 2. 和彩色 ### 标题。</p>
            <p>3. 体验返回手势：在详情页点击左上角“↙ 收起会话”或向右拖拽屏幕边缘即可流畅返回，不误跳工作台。</p>
            <p>4. 体验双语切换：点击右上角 <span class="text-zinc-200 font-mono">🌐 English / 中文</span> 查看专业术语规范翻译。</p>
            <p>5. 体验设置整合：点击底部 Dock 栏“设置”，查看全新重构的【通信与配对中枢】。</p>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
