                      我将使用 ask-user-question 弹出一道单选题，确认是否开始代码重构。
                    </p>
                    <div class="flex gap-2 pt-1">
                      <button 
                        onClick={() => alert("正在从工作台直达向导弹窗！")}
                        class="flex-1 py-2 bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs rounded-xl shadow transition-all font-mono"
                      >
                        ⚡ 立即前往作答
                      </button>
                      <button class="px-3 py-2 border border-zinc-700 bg-zinc-800 text-zinc-300 text-xs rounded-xl font-mono">
                        稍后
                      </button>
                    </div>
                  </div>

                  {/* 全新设计：工作台底部不再列长列表，而是提供轻量监督速览入口 */}
                  <div class={`p-4 rounded-3xl border flex items-center justify-between cursor-pointer hover:border-amber-500/50 transition-all ${cardClass}`}
                    onClick={() => setTab("monitor")}
                  >
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-500">
                        <Icons.Monitor size={20} />
                      </div>
                      <div>
                        <div class="text-xs font-bold flex items-center gap-1.5">
                          <span>多窗口监督中枢 (Cockpit)</span>
                          <span class="w-2 h-2 rounded-full bg-emerald-500 dot-pulse"></span>
                        </div>
                        <div class="text-[11px] opacity-60 font-mono mt-0.5">
                          当前 2 个 Agent 正在执行任务 · 1 个就绪
                        </div>
                      </div>
                    </div>
                    <Icons.ChevronRight size={16} className="opacity-50" />
                  </div>

                </div>
              )}

              {/* ========================================================================= */}
              {/* TAB 2: 会话管理（Sessions）—— 按项目折叠管理，解决找会话大海捞针 */}
              {/* ========================================================================= */}
              {tab === "sessions" && (
                <div class="flex-1 overflow-y-auto px-4 pt-2 pb-24 space-y-3 no-scrollbar">
                  
                  {/* 顶栏 Header */}
                  <div class="flex justify-between items-center py-1">
                    <div>
                      <h1 class="text-lg font-bold">会话档案</h1>
                      <p class="text-[11px] opacity-60 font-mono">按工作区组织的历史与活跃会话</p>
                    </div>
                    <button 
                      onClick={() => alert("新建会话")}
                      class="px-2.5 py-1 rounded-xl bg-amber-500 text-black font-bold text-xs font-mono flex items-center gap-1 shadow"
                    >
                      <span>+ 新建会话</span>
                    </button>
                  </div>

                  {/* 搜索栏 */}
                  <div class={`flex items-center gap-2 px-3 py-2 rounded-2xl border ${cardInnerClass}`}>
                    <Icons.Search size={14} className="opacity-50" />
                    <input
                      type="text"
                      placeholder="搜索会话标题、ID 或关键词…"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      class="bg-transparent text-xs focus:outline-none flex-1 font-mono placeholder:opacity-50"
                    />
                    {searchQuery && (
                      <button onClick={() => setSearchQuery("")} class="text-xs opacity-50">✕</button>
                    )}
                  </div>

                  {/* 核心亮点：项目分类胶囊选择器 (Project Filter Pills) */}
                  <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                    <button
                      onClick={() => setSelectedProject("all")}
                      class={`px-3 py-1.5 rounded-xl text-xs font-mono font-medium transition-all whitespace-nowrap ${
                        selectedProject === "all" ? "bg-amber-500 text-black font-bold shadow" : `${cardInnerClass} opacity-70`
                      }`}
                    >
                      全部项目 ({MOCK_PROJECT_SESSIONS.reduce((acc, p) => acc + p.totalCount, 0)})
                    </button>
                    {MOCK_PROJECT_SESSIONS.map(p => (
                      <button
                        key={p.project}
                        onClick={() => setSelectedProject(p.project)}
                        class={`px-3 py-1.5 rounded-xl text-xs font-mono font-medium transition-all flex items-center gap-1.5 whitespace-nowrap ${
                          selectedProject === p.project ? "bg-amber-500 text-black font-bold shadow" : `${cardInnerClass} opacity-70`
                        }`}
                      >
                        <span>{p.icon}</span>
                        <span>{p.project}</span>
                        <span class="opacity-60">({p.totalCount})</span>
                      </button>
                    ))}
                  </div>

                  {/* 项目分组列表：支持折叠与展开 */}
                  <div class="space-y-3 pt-1">
                    {MOCK_PROJECT_SESSIONS
                      .filter(p => selectedProject === "all" || p.project === selectedProject)
                      .map(p => {
                        const isExpanded = expandedProjects[p.project] ?? true;
                        return (
                          <div key={p.project} class={`rounded-3xl border overflow-hidden ${cardClass}`}>
                            {/* 分组头部：点击收起/展开 */}
                            <div 
                              onClick={() => toggleProject(p.project)}
                              class={`p-3.5 flex items-center justify-between cursor-pointer border-b ${
                                isExpanded ? "border-zinc-800/80" : "border-transparent"
                              } hover:bg-zinc-800/30 transition-all`}
                            >
                              <div class="flex items-center gap-2.5 min-w-0">
                                <span class="text-base">{p.icon}</span>
                                <div class="min-w-0">
                                  <div class="text-xs font-bold truncate flex items-center gap-2">
                                    <span>{p.project}</span>
                                    {p.activeCount > 0 && (
                                      <span class="px-1.5 py-0.2 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-mono">
                                        {p.activeCount} 活跃中
                                      </span>
                                    )}
                                  </div>
                                  <div class="text-[10px] opacity-50 font-mono truncate">{p.cwd}</div>
                                </div>
                              </div>
                              <div class="flex items-center gap-2">
                                <span class="text-[11px] font-mono opacity-50">{p.sessions.length} 个会话</span>
                                {isExpanded ? <Icons.ChevronDown size={15} /> : <Icons.ChevronRight size={15} />}
                              </div>
                            </div>

                            {/* 组内会话列表 */}
                            {isExpanded && (
                              <div class="divide-y divide-zinc-800/40">
                                {p.sessions.map(s => (
                                  <div 
                                    key={s.id}
                                    onClick={() => alert(`打开会话: ${s.title}`)}
                                    class="p-3.5 hover:bg-zinc-800/20 cursor-pointer transition-all space-y-1.5"
                                  >
                                    <div class="flex justify-between items-center">
                                      <div class="flex items-center gap-2 min-w-0">
                                        <span class={`w-2 h-2 rounded-full ${s.status === "running" ? "bg-emerald-500 dot-pulse" : "bg-zinc-600"}`}></span>
                                        <span class="text-xs font-bold truncate">{s.title}</span>
                                      </div>
                                      <span class="text-[10px] font-mono opacity-50">#{s.id}</span>
                                    </div>
                                    <div class="text-[11px] opacity-70 line-clamp-1 font-mono">{s.lastMsg}</div>
                                    <div class="flex justify-between items-center text-[10px] opacity-50 font-mono pt-0.5">
                                      <span>最后活动: {s.updatedAt}</span>
                                      <span>消耗: {s.tokens}</span>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}
                  </div>

                </div>
              )}

              {/* ========================================================================= */}
              {/* TAB 3: 监控中枢（Monitor）—— 彻底回归 /monitor 监督大盘定位 */}
              {/* ========================================================================= */}
              {tab === "monitor" && (
                <div class="flex-1 overflow-y-auto px-4 pt-2 pb-24 space-y-3.5 no-scrollbar">
                  
                  {/* 顶栏 Header */}
                  <div class="flex justify-between items-center py-1">
                    <div>
                      <div class="flex items-center gap-2">
                        <h1 class="text-lg font-bold">监督中枢</h1>
                        <span class="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-mono font-bold">
                          /monitor 协议对齐
                        </span>
                      </div>
                      <p class="text-[11px] opacity-60 font-mono">Workspace 并发 Agent 态势与异常告警</p>
                    </div>
                    
                    {/* 状态徽标 */}
                    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-xs font-mono">
                      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 dot-pulse"></span>
                      <span>3 窗口托管</span>
                    </div>
                  </div>

                  {/* 状态分流过滤器 */}
                  <div class="grid grid-cols-3 gap-1.5 p-1 rounded-2xl border font-mono text-xs" style={{ backgroundColor: isDark ? "#12141C" : "#F0F2F5" }}>
                    <button
                      onClick={() => setMonitorFilter("all")}
                      class={`py-1.5 rounded-xl font-medium transition-all ${
                        monitorFilter === "all" ? "bg-amber-500 text-black font-bold shadow" : "opacity-60"
                      }`}
                    >
                      全部 (3)
                    </button>
                    <button
                      onClick={() => setMonitorFilter("attention")}
                      class={`py-1.5 rounded-xl font-medium transition-all flex items-center justify-center gap-1 ${
                        monitorFilter === "attention" ? "bg-red-500 text-white font-bold shadow" : "opacity-60 text-red-400"
                      }`}
                    >
                      <span>告警/阻塞</span>
                      <span>({attentionCount})</span>
                    </button>
                    <button
                      onClick={() => setMonitorFilter("running")}
                      class={`py-1.5 rounded-xl font-medium transition-all flex items-center justify-center gap-1 ${
                        monitorFilter === "running" ? "bg-emerald-600 text-white font-bold shadow" : "opacity-60 text-emerald-400"
                      }`}
                    >
                      <span>运行中</span>
                      <span>(2)</span>
                    </button>
                  </div>

                  {/* 核心亮点：Attention-First 告警优先展示 */}
                  {attentionCount > 0 && monitorFilter !== "running" && (
                    <div class="rounded-3xl border border-red-500/60 bg-red-500/10 p-3.5 space-y-2">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-1.5 text-red-400 font-bold text-xs">
                          <Icons.AlertTriangle size={15} />
                          <span>需人工干预的异常事件 ({attentionCount})</span>
                        </div>
                        <span class="text-[10px] font-mono text-red-300">优先级: HIGH</span>
                      </div>
                      <div class="text-[11px] text-zinc-300 space-y-1 font-mono">
                        <div>· [party-worker-1] <span class="text-amber-400 font-bold">ask_pending</span>: 正在等待人工确认重构代码</div>
                        <div>· [metadata-parser] <span class="text-red-400 font-bold">context_pressure_high</span>: 上下文视窗已达 88%</div>
                      </div>
                    </div>
                  )}

                  {/* 窗口监督卡片列表：真正展示 Objective 目标 + 当前活跃动作 */}
                  <div class="space-y-3">
                    {filteredWindows.map((w) => {
                      const isRunning = w.status === "running";
                      const hasAttention = w.attention.length > 0;
                      const pressure = w.contextPressure;

                      return (
                        <div
                          key={w.endpointId}
                          class={`p-4 rounded-3xl border transition-all ${cardClass} ${
                            hasAttention ? "border-amber-500/60 shadow-md" : ""
                          }`}
                        >
                          {/* 卡片顶行：状态点 + 窗口名称 + 项目归属 */}
                          <div class="flex justify-between items-center mb-2">
                            <div class="flex items-center gap-2 min-w-0">
                              <span class={`w-2.5 h-2.5 rounded-full ${
                                isRunning ? "bg-emerald-500 dot-pulse" : "bg-zinc-600"
                              }`}></span>
                              <span class="font-bold text-xs truncate">{w.name}</span>
                              <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400">
                                {w.project}
                              </span>
                            </div>
                            <span class="text-[10px] font-mono opacity-50">#{w.endpointId.slice(0, 8)}</span>
                          </div>

                          {/* 核心亮点 1: 突出显示窗口的目标任务 (Objective) */}
                          <div class={`p-2.5 rounded-2xl border mb-2.5 ${cardInnerClass}`}>
                            <div class="text-[10px] opacity-50 font-mono mb-0.5">当前目标 (Objective):</div>
                            <div class="text-xs font-semibold text-zinc-200 leading-snug">
                              {w.objective}
                            </div>
                          </div>

                          {/* 核心亮点 2: 正在执行的动态 (Active Tool / Step) */}
                          <div class="flex items-center justify-between text-xs font-mono mb-2">
                            <div class="flex items-center gap-1.5 text-emerald-400 truncate">
                              <Icons.Terminal size={13} />
                              <span class="truncate">{w.activeStep}</span>
                            </div>
                          </div>

                          {/* 待办进度条与上下文视窗压力 */}
                          <div class="space-y-1.5 pt-1 border-t border-zinc-800/40">
                            <div class="flex justify-between items-center text-[10px] opacity-60 font-mono">
                              <span>Flow 任务进度 ({w.todos.filter(t => t.done).length}/{w.todos.length})</span>
                              <span class={pressure >= 80 ? "text-red-400 font-bold" : ""}>
                                上下文视窗: {pressure}%
                              </span>
                            </div>
                            <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden flex">
                              <div 
                                class="bg-amber-500 h-full rounded-full transition-all" 
                                style={{ width: `${(w.todos.filter(t => t.done).length / w.todos.length) * 100}%` }}
                              ></div>
                            </div>
                          </div>

                          {/* 核心亮点 3: 监督动作栏（取代旧版繁琐的常驻输入框） */}
                          <div class="flex items-center gap-2 mt-3.5 pt-2 border-t border-zinc-800/40">
                            <button
                              onClick={() => setActiveSuperviseWindow(w)}
                              class="flex-1 py-1.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 text-amber-400 border border-amber-500/30 text-xs font-mono font-bold flex items-center justify-center gap-1.5 transition-all"
                            >
                              <Icons.Send size={13} />
                              <span>干预指令 (Steer)</span>
                            </button>
                            <button
                              onClick={() => alert(`跳转至 ${w.name} 的全屏交互会话页面`)}
                              class="px-3 py-1.5 rounded-xl border border-zinc-700 bg-zinc-800/80 text-zinc-300 text-xs font-mono flex items-center gap-1 hover:border-zinc-500 transition-all"
                            >
                              <Icons.ExternalLink size={13} />
                              <span>进入会话</span>
                            </button>
                            <button
                              onClick={() => alert(`已向 ${w.name} 发送强行终止信号 (Abort)`)}
                              class="px-2.5 py-1.5 rounded-xl border border-red-900/60 bg-red-950/40 text-red-400 text-xs font-mono hover:bg-red-900/40 transition-all"
                              title="强行中止当前任务"
                            >
                              <Icons.StopCircle size={14} />
                            </button>
                          </div>

                        </div>
                      );
                    })}
                  </div>

                </div>
              )}

              {/* ========================================================================= */}
              {/* TAB 4: 设置页（Settings）—— 真实探测元数据与真实通知开关 */}
              {/* ========================================================================= */}
              {tab === "settings" && (
                <div class="flex-1 overflow-y-auto px-4 pt-2 pb-24 space-y-3.5 no-scrollbar">
                  
                  {/* 顶栏 Header */}
                  <div class="flex justify-between items-center py-1">
                    <div>
                      <h1 class="text-lg font-bold">设置</h1>
                      <p class="text-[11px] opacity-60 font-mono">系统首选项与引擎元数据</p>
                    </div>
                    <div class="text-[11px] font-mono text-zinc-500">v0.4.0</div>
                  </div>

                  {/* 业务通知设置（真实落地） */}
                  <div class={`p-4 rounded-3xl border space-y-3 ${cardClass}`}>
                    <div class="text-xs font-bold font-mono">系统与推送通知</div>
                    
                    <div class="flex justify-between items-center text-xs">
                      <div>
                        <div class="font-semibold text-zinc-200">Ask 待办提问通知</div>
                        <div class="text-[10px] opacity-50">收到操作或决策确认时下发系统横幅与震动</div>
                      </div>
                      <div class="w-9 h-5 bg-amber-500 rounded-full p-0.5 flex items-center justify-end shadow">
                        <div class="w-4 h-4 rounded-full bg-black"></div>
                      </div>
                    </div>

                    <div class="border-t border-zinc-800 pt-2.5 flex justify-between items-center text-xs">
                      <div>
                        <div class="font-semibold text-zinc-200">Agent 轮次完成通知</div>
                        <div class="text-[10px] opacity-50">本轮思考与工具执行全部结束时下发提醒</div>
                      </div>
                      <div class="w-9 h-5 bg-amber-500 rounded-full p-0.5 flex items-center justify-end shadow">
                        <div class="w-4 h-4 rounded-full bg-black"></div>
                      </div>
                    </div>
                  </div>

                  {/* 真实版本信息 */}
                  <div class={`p-4 rounded-3xl border space-y-2 text-xs font-mono ${cardClass}`}>
                    <div class="font-bold mb-2">组件与引擎版本 (真实探测)</div>
                    <div class="flex justify-between opacity-70">
                      <span>Maestro Mobile App:</span>
                      <span class="font-bold text-amber-500">0.4.0 (Build 19)</span>
                    </div>
                    <div class="flex justify-between opacity-70">
                      <span>Host 协同服务:</span>
                      <span>0.3.2</span>
                    </div>
                    <div class="flex justify-between opacity-70">
                      <span>Pi 会话引擎:</span>
                      <span>0.79.10</span>
                    </div>
                    <div class="flex justify-between opacity-70">
                      <span>pi-maestro-flow:</span>
                      <span>0.30.0</span>
                    </div>
                    <div class="flex justify-between opacity-70">
                      <span>Maestro CLI:</span>
                      <span>0.5.86</span>
                    </div>
                  </div>

                </div>
              )}

              {/* 弹窗：监督干预指令输入浮层 (Steer Intervention Sheet) */}
              {activeSuperviseWindow && (
                <div class="absolute inset-0 bg-black/80 z-50 flex flex-col justify-end p-4 animate-fade-in">
                  <div class={`rounded-3xl border p-4 space-y-3 shadow-2xl ${cardClass}`}>
                    <div class="flex justify-between items-center pb-2 border-b border-zinc-800">
                      <div class="flex items-center gap-2">
                        <Icons.Send size={15} className="text-amber-500" />
                        <span class="text-xs font-bold font-mono">向 #{activeSuperviseWindow.name} 注入干预指令</span>
                      </div>
                      <button onClick={() => setActiveSuperviseWindow(null)} class="text-xs opacity-60">✕</button>
                    </div>

                    <div class="text-[11px] opacity-70 font-mono">
                      当前目标: {activeSuperviseWindow.objective}
                    </div>

                    <textarea
                      rows="3"
                      value={steerMsg}
                      onChange={(e) => setSteerMsg(e.target.value)}
                      placeholder="输入协同引导策略（如：跳过耗时集成测试，先输出精简报告）…"
                      class={`w-full p-2.5 rounded-2xl border text-xs focus:outline-none focus:border-amber-500 font-mono ${
                        isDark ? "bg-black/60 border-zinc-700 text-white" : "bg-white border-zinc-300 text-zinc-900"
                      }`}
                    ></textarea>

                    <div class="flex gap-2">
                      <button
                        onClick={() => {
                          alert(`已成功向 ${activeSuperviseWindow.name} 发送 Steer 协同修正指令！`);
                          setSteerMsg("");
                          setActiveSuperviseWindow(null);
                        }}
                        class="flex-1 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs font-mono shadow"
                      >
                        ⚡ 确认注入干预
                      </button>
                      <button
                        onClick={() => setActiveSuperviseWindow(null)}
                        class="px-4 py-2 rounded-xl border border-zinc-700 text-xs font-mono opacity-80"
                      >
                        取消
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* 底部 iOS Navigation Dock */}
              <div class={`absolute bottom-0 inset-x-0 h-20 border-t flex items-center justify-around px-2 z-40 ${dockClass}`}>
                {[
                  { id: "workbench", label: "工作台", icon: Icons.Workbench },
                  { id: "sessions", label: "会话档案", icon: Icons.Sessions },
                  { id: "monitor", label: "监督中枢", icon: Icons.Monitor, badge: attentionCount },
                  { id: "settings", label: "设置", icon: Icons.Settings }
                ].map((item) => {
                  const active = tab === item.id;
                  const Icon = item.icon;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setTab(item.id)}
                      class={`flex flex-col items-center gap-1 py-1 px-3 rounded-2xl transition-all relative ${
                        active ? "text-amber-500 scale-105" : "text-zinc-500 hover:text-zinc-300"
                      }`}
                    >
                      <Icon size={20} />
                      <span class="text-[10px] font-semibold tracking-tight">{item.label}</span>
                      {item.badge > 0 && (
                        <span class="absolute top-0.5 right-2 w-4 h-4 rounded-full bg-red-500 text-white text-[9px] font-bold flex items-center justify-center font-mono shadow">
                          {item.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>

            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
