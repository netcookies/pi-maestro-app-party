  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <text x="640" y="150" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="#f1f5f9">Maestro Mobile</text>
  <text x="640" y="215" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="30" fill="#94a3b8">在手机上使用你的 PC 端 Pi Agent</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" text-anchor="middle">
    <rect x="170" y="270" width="220" height="64" rx="14" fill="#1e293b" stroke="#334155"/>
