# maestro-mobile Docker Compose — 看板模式
#
# 用法：
#   MAESTRO_MOBILE_TOKEN=your-secret docker compose -f deploy/docker-compose.host.yml up -d
#
# 能力边界：Dashboard / Monitor 窗口 / usage 统计 / 会话历史浏览可用；
# open_session / steer_window 会话接管不可用（容器内无 pi）。
# 需要接管能力时用宿主安装（npm i -g pi-maestro-mobile）。

services:
  host:
    build:
      context: ..
      dockerfile: Dockerfile
    image: maestro-mobile:latest
    container_name: maestro-mobile
    restart: unless-stopped
    ports:
      - "4739:4739"
    environment:
      # 必填：局域网内手机直连的鉴权 token
      MAESTRO_MOBILE_TOKEN: ${MAESTRO_MOBILE_TOKEN:?set MAESTRO_MOBILE_TOKEN}
      # projectRoot 影响 flow-schedule（.pi/flow-schedule）读取根；
      # 看板模式下调度状态来自挂载的 projects 目录
      MAESTRO_MOBILE_PROJECT_ROOT: /workspace
      MAESTRO_MOBILE_POLL_MS: "5000"
    volumes:
      # 会话 JSONL（usage 统计 + 历史浏览）——只读
      - ${HOME}/.pi/agent/sessions:/home/node/.pi/agent/sessions:ro
      # teammate 窗口 telemetry（Monitor owners / contextPressure）——只读
      - ${HOME}/.pi/teammate:/home/node/.pi/teammate:ro
      # 需要看 maestro 调度状态时，把项目目录挂进来（可多个）：
      # - ~/Projects/my-project:/workspace:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4739/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
