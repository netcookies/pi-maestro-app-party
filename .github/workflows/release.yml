name: Release

# 触发：push maestro-mobile-v* tag（如 maestro-mobile-v0.1.1）
# 产物：签名 APK + 未签名 IPA + npm publish + GitHub Release
# 本地发布（GitHub runner 限额时）用 scripts/release-local.sh，产物一致

on:
  push:
    tags:
      - "maestro-mobile-v*"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write   # npm Trusted Publishers（OIDC）：publish 无需 NPM_TOKEN

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm 版本从 package.json 的 packageManager 字段读取（避免双源冲突）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 版本号：tag maestro-mobile-v0.1.1 → 0.1.1 ──
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/maestro-mobile-v* ]]; then
            V="${GITHUB_REF#refs/tags/maestro-mobile-v}"
          else
            V="$(node -p "require('./apps/host/package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building maestro-mobile v$V"

      # ── host npm publish（Trusted Publisher OIDC：无需 NPM_TOKEN，需在 npmjs.com 包 Settings 配置本 workflow）──
      - name: Publish npm package
        if: startsWith(github.ref, 'refs/tags/maestro-mobile-v')
        working-directory: apps/host
        run: |
          # Trusted Publishing（OIDC）需要 npm >= 11.5.1（node 22 自带 10.x）
          npm install -g npm@11
          npm --version
          npm publish --provenance --access public

      # ── Android：签名 release APK（混淆 + 资源收缩已默认启用）──
      - name: Decode keystore
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/maestro-release.jks
          echo "RELEASE_KEYSTORE_FILE=/tmp/maestro-release.jks"      >> local.properties
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> local.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"  >> local.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> local.properties

      - name: Build signed release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          BT="$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          cp "$APK" "maestro-mobile-${{ steps.ver.outputs.version }}.apk"

      # ── iOS：未签名 IPA（Pods 不入库，需先 pod install）──
      - name: Build unsigned iOS IPA
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --no-install || true
          cd ios && pod install --repo-update
          xcodebuild -workspace MaestroMobile.xcworkspace -scheme MaestroMobile \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -3
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp && zip -qry maestro-mobile-unsigned-${{ steps.ver.outputs.version }}.ipa Payload
          cp /tmp/maestro-mobile-unsigned-*.ipa "$GITHUB_WORKSPACE/"

      # ── GitHub Release ──
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="maestro-mobile-v$VERSION"
          gh release create "$TAG" \
            --title "Maestro Mobile v$VERSION" \
            --notes "$(cat <<EOF
          ## 安装

          - **Android**: 下载 .apk 直接安装（已用 release key 签名）
          - **iOS**: 下载 unsigned .ipa，用 [Sideloadly](https://sideloadly.io)/AltStore + 自己的 Apple ID 重签后安装
          - **PC Host**: \`npm install -g pi-pi-maestro-mobile@$VERSION\`，或 \`pi install npm:pi-maestro-mobile\`

          完整部署文档见仓库 docs/deploy.md
          EOF
          )" \
            "maestro-mobile-$VERSION.apk" \
            "maestro-mobile-unsigned-$VERSION.ipa"

      # host 产物不挂 release（npm 即分发渠道），但保留 workflow 日志可追溯
